<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 480" width="100%" height="100%">
  
    <defs>
      <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#15263a"/>
        <stop offset="100%" stop-color="#0f1d2c"/>
      </linearGradient>
      <linearGradient id="mintGrad" x1="0%" y1="0%" x2="100%" y2="0%">
        <stop offset="0%" stop-color="#5ee0c2"/>
        <stop offset="100%" stop-color="#38bdf8"/>
      </linearGradient>
      <linearGradient id="accentGrad" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%" stop-color="#38bdf8"/>
        <stop offset="100%" stop-color="#818cf8"/>
      </linearGradient>
      <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
        <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.35"/>
      </filter>
      <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M 0 1 L 10 5 L 0 9 z" fill="#5ee0c2" />
      </marker>
      <marker id="arrowSky" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M 0 1 L 10 5 L 0 9 z" fill="#38bdf8" />
      </marker>
      <marker id="arrowIndigo" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M 0 1 L 10 5 L 0 9 z" fill="#818cf8" />
      </marker>
    </defs>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
      .title { font-weight: 700; fill: #ffffff; }
      .subtitle { fill: #94a3b8; font-size: 13px; }
      .badge-text { font-size: 11px; font-weight: 600; text-anchor: middle; fill: #0b1927; }
      .card-title { font-size: 15px; font-weight: 600; fill: #5ee0c2; }
      .card-desc { font-size: 12.5px; fill: #cbd5e1; }
      .formula { font-family: "Courier New", monospace; font-size: 13px; fill: #fbbf24; }
      .axis { stroke: #475569; stroke-width: 1.5; }
      .grid { stroke: #1e293b; stroke-width: 1; stroke-dasharray: 4,4; }
    </style>

  <rect width="100%" height="100%" rx="14" fill="#0b1927" stroke="#253a52" stroke-width="1.5"/>
  
  <!-- Header -->
  <text x="40" y="45" class="title" font-size="20">Cosine Similarity: วัดทิศทางของรสนิยมโดยตัดอคติของสเกลคะแนน</text>
  <text x="40" y="70" class="subtitle">Cosine พิจารณาเฉพาะมุม θ ระหว่างเวกเตอร์สองชุด โดยไม่สนใจความยาว (Norm) ของเวกเตอร์</text>

  <!-- Left: Coordinate System -->
  <g transform="translate(60, 100)">
    <!-- Grid -->
    <line x1="50" y1="280" x2="380" y2="280" class="axis" marker-end="url(#arrowSky)"/>
    <line x1="50" y1="280" x2="50" y2="30" class="axis" marker-end="url(#arrowSky)"/>
    <text x="390" y="285" fill="#94a3b8" font-size="12">มิติ 1 (เช่น แอ็กชัน)</text>
    <text x="50" y="20" fill="#94a3b8" font-size="12">มิติ 2 (เช่น ไซไฟ)</text>

    <!-- Vector U (User A) -->
    <line x1="50" y1="280" x2="290" y2="90" stroke="#5ee0c2" stroke-width="3.5" marker-end="url(#arrow)"/>
    <circle cx="290" cy="90" r="5" fill="#5ee0c2"/>
    <text x="300" y="85" fill="#5ee0c2" font-weight="700" font-size="14">เวกเตอร์ u (ผู้ใช้ A)</text>
    <text x="300" y="105" fill="#94a3b8" font-size="11">[ให้คะแนนเฉลี่ย 4-5 ดาว]</text>

    <!-- Vector V (User B) -->
    <line x1="50" y1="280" x2="190" y2="160" stroke="#38bdf8" stroke-width="3.5" marker-end="url(#arrowSky)"/>
    <circle cx="190" cy="160" r="5" fill="#38bdf8"/>
    <text x="110" y="150" fill="#38bdf8" font-weight="700" font-size="14">เวกเตอร์ v (ผู้ใช้ B)</text>
    <text x="70" y="170" fill="#94a3b8" font-size="11">[ให้คะแนนเฉลี่ย 2-3 ดาว (เข้มงวด)]</text>

    <!-- Angle Arc -->
    <path d="M 120 230 A 70 70 0 0 0 150 200" fill="none" stroke="#fbbf24" stroke-width="2.5" stroke-dasharray="3,3"/>
    <text x="145" y="225" fill="#fbbf24" font-weight="700" font-size="16">มุม θ</text>
  </g>

  <!-- Right: Interpretation Cards -->
  <g transform="translate(480, 110)">
    <!-- Formula Box -->
    <rect x="0" y="0" width="390" height="90" rx="10" fill="#15263a" stroke="#304b65" stroke-width="1.2" filter="url(#shadow)"/>
    <text x="20" y="30" class="card-title">สูตร Cosine Similarity:</text>
    <text x="20" y="62" class="formula" font-size="16">cos(θ) = (u · v) / (||u|| × ||v||)</text>

    <!-- 3 States -->
    <g transform="translate(0, 108)">
      <rect x="0" y="0" width="390" height="60" rx="8" fill="#102334" stroke="#5ee0c2" stroke-width="1.2"/>
      <text x="20" y="26" fill="#5ee0c2" font-weight="700" font-size="13">θ = 0° → cos(θ) = 1.00 (รสนิยมตรงกันสมบูรณ์)</text>
      <text x="20" y="46" fill="#94a3b8" font-size="12">ชอบสัดส่วนประเภทหนังเหมือนกัน แม้คนหนึ่งจะให้ 5 ดาว อีกคนให้ 2 ดาว</text>
    </g>

    <g transform="translate(0, 180)">
      <rect x="0" y="0" width="390" height="60" rx="8" fill="#102334" stroke="#475569" stroke-width="1.2"/>
      <text x="20" y="26" fill="#94a3b8" font-weight="700" font-size="13">θ = 90° → cos(θ) = 0.00 (ไม่เกี่ยวข้องกัน / ตั้งฉาก)</text>
      <text x="20" y="46" fill="#64748b" font-size="12">เวกเตอร์ชี้ไปคนละมิติ เช่น คนหนึ่งดูเฉพาะกีฬา อีกคนดูเฉพาะอนิเมะ</text>
    </g>

    <g transform="translate(0, 252)">
      <rect x="0" y="0" width="390" height="60" rx="8" fill="#102334" stroke="#f43f5e" stroke-width="1.2"/>
      <text x="20" y="26" fill="#f43f5e" font-weight="700" font-size="13">θ = 180° → cos(θ) = -1.00 (รสนิยมตรงข้ามกันสิ้นเชิง)</text>
      <text x="20" y="46" fill="#94a3b8" font-size="12">ชิ้นที่คนหนึ่งชอบมาก อีกคนหนึ่งจะเกลียดมาก (Opposite Taste)</text>
    </g>
  </g>
</svg>