<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 460" width="100%" height="100%">
  
    <defs>
      <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#15263a"/>
        <stop offset="100%" stop-color="#0f1d2c"/>
      </linearGradient>
      <linearGradient id="mintGrad" x1="0%" y1="0%" x2="100%" y2="0%">
        <stop offset="0%" stop-color="#5ee0c2"/>
        <stop offset="100%" stop-color="#38bdf8"/>
      </linearGradient>
      <linearGradient id="accentGrad" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%" stop-color="#38bdf8"/>
        <stop offset="100%" stop-color="#818cf8"/>
      </linearGradient>
      <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
        <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.35"/>
      </filter>
      <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M 0 1 L 10 5 L 0 9 z" fill="#5ee0c2" />
      </marker>
      <marker id="arrowSky" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M 0 1 L 10 5 L 0 9 z" fill="#38bdf8" />
      </marker>
      <marker id="arrowIndigo" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M 0 1 L 10 5 L 0 9 z" fill="#818cf8" />
      </marker>
    </defs>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
      .title { font-weight: 700; fill: #ffffff; }
      .subtitle { fill: #94a3b8; font-size: 13px; }
      .badge-text { font-size: 11px; font-weight: 600; text-anchor: middle; fill: #0b1927; }
      .card-title { font-size: 15px; font-weight: 600; fill: #5ee0c2; }
      .card-desc { font-size: 12.5px; fill: #cbd5e1; }
      .formula { font-family: "Courier New", monospace; font-size: 13px; fill: #fbbf24; }
      .axis { stroke: #475569; stroke-width: 1.5; }
      .grid { stroke: #1e293b; stroke-width: 1; stroke-dasharray: 4,4; }
    </style>

  <rect width="100%" height="100%" rx="14" fill="#0b1927" stroke="#253a52" stroke-width="1.5"/>

  <text x="40" y="42" class="title" font-size="20">Discounted Cumulative Gain: เส้นโค้งการลดทอนคุณค่าตามอันดับ</text>
  <text x="40" y="66" class="subtitle">สูตร Discount Factor = 1 / log2(rank + 1) อธิบายว่าทำไมการวางของดีไว้ที่อันดับ 1 จึงมีคุณค่าสูงกว่าอันดับ 10 ถึง 3.4 เท่า</text>

  <g transform="translate(60, 100)">
    <!-- Axes -->
    <line x1="50" y1="280" x2="800" y2="280" class="axis" marker-end="url(#arrowSky)"/>
    <line x1="50" y1="280" x2="50" y2="20" class="axis" marker-end="url(#arrowSky)"/>
    <text x="795" y="305" fill="#94a3b8" font-size="11.5" text-anchor="end">อันดับที่แสดง (Rank: i) →</text>
    <text x="55" y="18" fill="#94a3b8" font-size="12">↑ ตัวลดทอนคุณค่า Discount Factor: 1/log2(i+1)</text>

    <!-- Bars for Ranks 1 to 10 -->
    <!-- Rank 1: 1.000 (height 220) -->
    <rect x="80" y="60" width="40" height="220" rx="4" fill="#5ee0c2" filter="url(#shadow)"/>
    <text x="100" y="50" fill="#5ee0c2" font-weight="700" font-size="13" text-anchor="middle">1.000</text>
    <text x="100" y="298" fill="#ffffff" font-size="12" text-anchor="middle">i = 1</text>

    <!-- Rank 2: 0.631 (height 138) -->
    <rect x="150" y="142" width="40" height="138" rx="4" fill="#38bdf8"/>
    <text x="170" y="132" fill="#38bdf8" font-size="12" text-anchor="middle">0.631</text>
    <text x="170" y="298" fill="#94a3b8" font-size="12" text-anchor="middle">i = 2</text>

    <!-- Rank 3: 0.500 (height 110) -->
    <rect x="220" y="170" width="40" height="110" rx="4" fill="#38bdf8"/>
    <text x="240" y="160" fill="#38bdf8" font-size="12" text-anchor="middle">0.500</text>
    <text x="240" y="298" fill="#94a3b8" font-size="12" text-anchor="middle">i = 3</text>

    <!-- Rank 4: 0.431 -->
    <rect x="290" y="185" width="40" height="95" rx="4" fill="#818cf8"/>
    <text x="310" y="177" fill="#818cf8" font-size="11" text-anchor="middle">0.431</text>
    <text x="310" y="298" fill="#94a3b8" font-size="12" text-anchor="middle">i = 4</text>

    <!-- Rank 5: 0.387 -->
    <rect x="360" y="195" width="40" height="85" rx="4" fill="#818cf8"/>
    <text x="380" y="187" fill="#818cf8" font-size="11" text-anchor="middle">0.387</text>
    <text x="380" y="298" fill="#94a3b8" font-size="12" text-anchor="middle">i = 5</text>

    <!-- Rank 10: 0.289 -->
    <rect x="640" y="216" width="40" height="64" rx="4" fill="#64748b"/>
    <text x="660" y="208" fill="#94a3b8" font-size="11" text-anchor="middle">0.289</text>
    <text x="660" y="298" fill="#94a3b8" font-size="12" text-anchor="middle">i = 10</text>

    <!-- Discount Curve Line -->
    <path d="M 100 60 Q 180 150 240 170 T 380 195 T 660 216" fill="none" stroke="#fbbf24" stroke-width="2.5" stroke-dasharray="4,4"/>

    <!-- Annotation Callout -->
    <g transform="translate(440, 70)">
      <rect x="0" y="0" width="320" height="85" rx="8" fill="#15263a" stroke="#fbbf24" stroke-width="1.2" filter="url(#shadow)"/>
      <text x="20" y="26" fill="#fbbf24" font-weight="700" font-size="13">เปรียบเทียบคุณค่าตำแหน่ง:</text>
      <text x="20" y="48" fill="#cbd5e1" font-size="12">• อันดับ 1 ได้คะแนนเต็ม 100%</text>
      <text x="20" y="68" fill="#cbd5e1" font-size="12">• วางชิ้นเดียวกันที่อันดับ 10 คุณค่าเหลือเพียง 28.9%</text>
    </g>
  </g>
</svg>