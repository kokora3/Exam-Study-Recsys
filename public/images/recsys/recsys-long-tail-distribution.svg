<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 460" width="100%" height="100%">
  
    <defs>
      <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#15263a"/>
        <stop offset="100%" stop-color="#0f1d2c"/>
      </linearGradient>
      <linearGradient id="mintGrad" x1="0%" y1="0%" x2="100%" y2="0%">
        <stop offset="0%" stop-color="#5ee0c2"/>
        <stop offset="100%" stop-color="#38bdf8"/>
      </linearGradient>
      <linearGradient id="accentGrad" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%" stop-color="#38bdf8"/>
        <stop offset="100%" stop-color="#818cf8"/>
      </linearGradient>
      <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
        <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.35"/>
      </filter>
      <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M 0 1 L 10 5 L 0 9 z" fill="#5ee0c2" />
      </marker>
      <marker id="arrowSky" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M 0 1 L 10 5 L 0 9 z" fill="#38bdf8" />
      </marker>
      <marker id="arrowIndigo" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M 0 1 L 10 5 L 0 9 z" fill="#818cf8" />
      </marker>
    </defs>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
      .title { font-weight: 700; fill: #ffffff; }
      .subtitle { fill: #94a3b8; font-size: 13px; }
      .badge-text { font-size: 11px; font-weight: 600; text-anchor: middle; fill: #0b1927; }
      .card-title { font-size: 15px; font-weight: 600; fill: #5ee0c2; }
      .card-desc { font-size: 12.5px; fill: #cbd5e1; }
      .formula { font-family: "Courier New", monospace; font-size: 13px; fill: #fbbf24; }
      .axis { stroke: #475569; stroke-width: 1.5; }
      .grid { stroke: #1e293b; stroke-width: 1; stroke-dasharray: 4,4; }
    </style>

  <rect width="100%" height="100%" rx="14" fill="#0b1927" stroke="#253a52" stroke-width="1.5"/>

  <text x="40" y="42" class="title" font-size="20">The Long Tail Phenomenon: ขุมทรัพย์ที่ซ่อนอยู่ในสินค้าหางยาว</text>
  <text x="40" y="66" class="subtitle">ระบบแนะนำสร้างมูลค่าสูงสุดจากการปลดล็อกสินค้า 80% ในส่วน Tail ที่ร้านค้าทั่วไปไม่มีพื้นที่วางโชว์</text>

  <g transform="translate(60, 100)">
    <!-- Axes -->
    <line x1="40" y1="280" x2="800" y2="280" class="axis" marker-end="url(#arrowSky)"/>
    <line x1="40" y1="280" x2="40" y2="20" class="axis" marker-end="url(#arrowSky)"/>
    <text x="795" y="305" fill="#94a3b8" font-size="11.5" text-anchor="end">อันดับความนิยมของสินค้า (Popularity Rank) →</text>
    <text x="45" y="15" fill="#94a3b8" font-size="12">↑ ยอดขาย / การรับชม (Volume)</text>

    <!-- Head Area (Top 20%) -->
    <path d="M 40 40 Q 90 60 160 170 L 160 280 L 40 280 Z" fill="#38bdf8" fill-opacity="0.25"/>
    <!-- Torso Area -->
    <path d="M 160 170 Q 230 220 340 250 L 340 280 L 160 280 Z" fill="#818cf8" fill-opacity="0.25"/>
    <!-- Tail Area (80%) -->
    <path d="M 340 250 Q 550 270 760 275 L 760 280 L 340 280 Z" fill="#5ee0c2" fill-opacity="0.25"/>

    <!-- Curve -->
    <path d="M 40 40 Q 90 60 160 170 Q 230 220 340 250 Q 550 270 760 275" fill="none" stroke="#5ee0c2" stroke-width="3.5"/>

    <!-- Partition Lines -->
    <line x1="160" y1="280" x2="160" y2="120" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="4,4"/>
    <line x1="340" y1="280" x2="340" y2="190" stroke="#818cf8" stroke-width="1.5" stroke-dasharray="4,4"/>

    <!-- Head Card -->
    <rect x="50" y="60" width="100" height="55" rx="6" fill="#15263a" stroke="#38bdf8" stroke-width="1"/>
    <text x="100" y="80" fill="#38bdf8" font-weight="700" font-size="13" text-anchor="middle">HEAD (20%)</text>
    <text x="100" y="100" fill="#cbd5e1" font-size="11" text-anchor="middle">สินค้าฮิต ยอดขายสูง</text>

    <!-- Torso Card -->
    <rect x="190" y="130" width="120" height="55" rx="6" fill="#15263a" stroke="#818cf8" stroke-width="1"/>
    <text x="250" y="150" fill="#818cf8" font-weight="700" font-size="13" text-anchor="middle">TORSO (กลางๆ)</text>
    <text x="250" y="170" fill="#cbd5e1" font-size="11" text-anchor="middle">สินค้าหมวดหมู่เฉพาะ</text>

    <!-- Tail Card -->
    <rect x="390" y="155" width="370" height="90" rx="8" fill="#15263a" stroke="#5ee0c2" stroke-width="1.5" filter="url(#shadow)"/>
    <text x="410" y="182" fill="#5ee0c2" font-weight="700" font-size="14">THE LONG TAIL (สินค้าหางยาว 80%)</text>
    <text x="410" y="206" fill="#e2e8f0" font-size="12">• สินค้า Niche ที่ไม่มีในหน้าร้านทั่วไป</text>
    <text x="410" y="228" fill="#fbbf24" font-weight="600" font-size="11.5">⭐ พื้นที่สร้างความประทับใจและความต่างของ RecSys</text>
  </g>
</svg>