<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 520" width="100%" height="100%">
  <defs>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#15263a"/>
      <stop offset="100%" stop-color="#0f1d2c"/>
    </linearGradient>
    <linearGradient id="stage1Grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#152c42"/>
      <stop offset="100%" stop-color="#0e1f30"/>
    </linearGradient>
    <linearGradient id="stage2Grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#15333a"/>
      <stop offset="100%" stop-color="#0e2329"/>
    </linearGradient>
    <linearGradient id="stage3Grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#262d3a"/>
      <stop offset="100%" stop-color="#191e28"/>
    </linearGradient>
    <linearGradient id="tealGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f766e"/>
      <stop offset="100%" stop-color="#044e47"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#5ee0c2" />
    </marker>
    <marker id="arrowSky" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#38bdf8" />
    </marker>
    <marker id="arrowIndigo" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#818cf8" />
    </marker>
    <marker id="arrowAmber" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#fbbf24" />
    </marker>
  </defs>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Sarabun", "Noto Sans Thai", sans-serif; }
    .title { font-weight: 700; fill: #ffffff; }
    .subtitle { fill: #94a3b8; font-size: 12.5px; }
  </style>

  <rect width="100%" height="100%" rx="14" fill="#0b1927" stroke="#253a52" stroke-width="1.5"/>

  <!-- Main Header -->
  <text x="40" y="38" class="title" font-size="19">The RecSys Multi-Stage Funnel: สถาปัตยกรรม 3 สายพานระดับ Production</text>
  <text x="40" y="60" class="subtitle">การกรองแบบกรวยหลายชั้นเพื่อสร้างสมดุลระหว่างความเร็วระดับมิลลิวินาที (Latency) และความแม่นยำสูงสุด (Accuracy)</text>

  <!-- LEFT COLUMN: VISUAL MULTI-STAGE FUNNEL -->
  <!-- Stage 1 Funnel Tier -->
  <g transform="translate(35, 84)">
    <path d="M 5 0 L 235 0 L 205 80 L 35 80 Z" fill="url(#stage1Grad)" stroke="#38bdf8" stroke-width="1.5" filter="url(#shadow)"/>
    <rect x="55" y="12" width="130" height="20" rx="10" fill="#38bdf8"/>
    <text x="120" y="26" fill="#0b1927" font-size="10.5" font-weight="700" text-anchor="middle">STAGE 1: RETRIEVAL</text>
    <text x="120" y="49" fill="#ffffff" font-size="13.5" font-weight="700" text-anchor="middle">1,000,000+ ชิ้น</text>
    <text x="120" y="66" fill="#94a3b8" font-size="10" text-anchor="middle">คลังสินค้าทั้งหมด (All Corpus)</text>
  </g>

  <!-- Flow 1 -> 2 -->
  <path d="M 155 164 L 155 180" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrowSky)"/>

  <!-- Stage 2 Funnel Tier -->
  <g transform="translate(35, 184)">
    <path d="M 35 0 L 205 0 L 180 80 L 60 80 Z" fill="url(#stage2Grad)" stroke="#5ee0c2" stroke-width="1.5" filter="url(#shadow)"/>
    <rect x="62" y="12" width="116" height="20" rx="10" fill="#5ee0c2"/>
    <text x="120" y="26" fill="#0b1927" font-size="10.5" font-weight="700" text-anchor="middle">STAGE 2: SCORING</text>
    <text x="120" y="49" fill="#ffffff" font-size="13.5" font-weight="700" text-anchor="middle">~100 - 500 ชิ้น</text>
    <text x="120" y="66" fill="#94a3b8" font-size="10" text-anchor="middle">ผู้สมัครที่ผ่านเกณฑ์เบื้องต้น</text>
  </g>

  <!-- Flow 2 -> 3 -->
  <path d="M 155 264 L 155 280" stroke="#5ee0c2" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Stage 3 Funnel Tier -->
  <g transform="translate(35, 284)">
    <path d="M 60 0 L 180 0 L 158 80 L 82 80 Z" fill="url(#stage3Grad)" stroke="#fbbf24" stroke-width="1.5" filter="url(#shadow)"/>
    <rect x="68" y="12" width="104" height="20" rx="10" fill="#fbbf24"/>
    <text x="120" y="26" fill="#0b1927" font-size="10" font-weight="700" text-anchor="middle">STAGE 3: RE-RANK</text>
    <text x="120" y="49" fill="#ffffff" font-size="13.5" font-weight="700" text-anchor="middle">~50 ชิ้น</text>
    <text x="120" y="66" fill="#94a3b8" font-size="10" text-anchor="middle">ไอเทมคะแนนสูงสุด</text>
  </g>

  <!-- Flow 3 -> Final -->
  <path d="M 155 364 L 155 380" stroke="#fbbf24" stroke-width="2" marker-end="url(#arrowAmber)"/>

  <!-- Final Output Spout -->
  <g transform="translate(35, 384)">
    <rect x="40" y="0" width="160" height="46" rx="8" fill="url(#tealGrad)" stroke="#5ee0c2" stroke-width="1.5" filter="url(#shadow)"/>
    <text x="120" y="20" fill="#ffffff" font-size="12.5" font-weight="700" text-anchor="middle">✨ Final Top-K Display</text>
    <text x="120" y="36" fill="#a7f3d0" font-size="11" font-weight="600" text-anchor="middle">10 - 20 ชิ้น บนหน้าจอจริง</text>
  </g>

  <!-- Mini Latency Budget Badge -->
  <g transform="translate(35, 442)">
    <rect x="25" y="0" width="190" height="54" rx="8" fill="#0f1d2c" stroke="#253a52" stroke-width="1"/>
    <text x="120" y="21" fill="#fbbf24" font-size="11" font-weight="700" text-anchor="middle">⏱️ Latency Budget รวม</text>
    <text x="120" y="40" fill="#cbd5e1" font-size="11" text-anchor="middle">&lt; 40 - 70 ms (รวม 3 ด่าน)</text>
  </g>

  <!-- Connecting Bridges (Dashed lines tying Funnel to Cards) -->
  <line x1="240" y1="124" x2="285" y2="124" stroke="#38bdf8" stroke-dasharray="3,3" stroke-width="1.5"/>
  <line x1="215" y1="224" x2="285" y2="224" stroke="#5ee0c2" stroke-dasharray="3,3" stroke-width="1.5"/>
  <line x1="195" y1="324" x2="285" y2="324" stroke="#fbbf24" stroke-dasharray="3,3" stroke-width="1.5"/>

  <!-- RIGHT COLUMN: 3 DETAILED STAGE CARDS + EXAM SUMMARY -->
  <!-- Card 1: Retrieval -->
  <g transform="translate(285, 84)">
    <rect x="0" y="0" width="620" height="98" rx="10" fill="#15263a" stroke="#38bdf8" stroke-width="1.5" filter="url(#shadow)"/>
    <!-- Stage Badge & Title -->
    <rect x="20" y="10" width="64" height="22" rx="4" fill="#38bdf8"/>
    <text x="52" y="25" fill="#0b1927" font-size="11" font-weight="700" text-anchor="middle">STAGE 1</text>
    <text x="94" y="26" fill="#ffffff" font-size="14.5" font-weight="700">Candidate Generation (การค้นคืนผู้สมัคร)</text>
    <!-- Latency Pill -->
    <rect x="475" y="10" width="125" height="22" rx="4" fill="#0e304f" stroke="#38bdf8" stroke-width="1"/>
    <text x="537" y="25" fill="#38bdf8" font-size="11" font-weight="600" text-anchor="middle">⚡ Latency: &lt; 10-20 ms</text>
    <!-- Card Details -->
    <text x="20" y="49" fill="#cbd5e1" font-size="12">• ขอบเขต: คลัง 1,000,000+ ชิ้น → คัดเหลือ ~100 - 500 ชิ้น (เน้น High Recall)</text>
    <text x="20" y="68" fill="#94a3b8" font-size="11.5">• เทคนิค: Two-Tower DSSM, Vector Search (ANN / FAISS / HNSW), Item-kNN</text>
    <text x="20" y="87" fill="#38bdf8" font-size="11.5" font-weight="500">• หัวใจหลัก: ฟีเจอร์เบา ประมวลผลเร็วมาก ป้องกันไม่ให้ไอเทมที่ตรงใจหลุดรอด</text>
  </g>

  <!-- Card 2: Scoring -->
  <g transform="translate(285, 192)">
    <rect x="0" y="0" width="620" height="98" rx="10" fill="#15263a" stroke="#5ee0c2" stroke-width="1.5" filter="url(#shadow)"/>
    <!-- Stage Badge & Title -->
    <rect x="20" y="10" width="64" height="22" rx="4" fill="#5ee0c2"/>
    <text x="52" y="25" fill="#0b1927" font-size="11" font-weight="700" text-anchor="middle">STAGE 2</text>
    <text x="94" y="26" fill="#ffffff" font-size="14.5" font-weight="700">Heavy Scoring &amp; Ranking (การให้คะแนนละเอียด)</text>
    <!-- Latency Pill -->
    <rect x="475" y="10" width="125" height="22" rx="4" fill="#0c3938" stroke="#5ee0c2" stroke-width="1"/>
    <text x="537" y="25" fill="#5ee0c2" font-size="11" font-weight="600" text-anchor="middle">🎯 Latency: 20-40 ms</text>
    <!-- Card Details -->
    <text x="20" y="49" fill="#cbd5e1" font-size="12">• ขอบเขต: ~100 - 500 ชิ้น → คำนวณคะแนนละเอียดเหลือ ~50 ชิ้น (เน้น High Precision)</text>
    <text x="20" y="68" fill="#94a3b8" font-size="11.5">• เทคนิค: DeepFM, DLRM, Wide &amp; Deep, GBDT, ฟีเจอร์ตัดข้าม (Cross-Features)</text>
    <text x="20" y="87" fill="#5ee0c2" font-size="11.5" font-weight="500">• หัวใจหลัก: ทายความน่าจะเป็นแม่นยำระดับทศนิยม (pCTR, pCVR, Expected Value)</text>
  </g>

  <!-- Card 3: Re-ranking -->
  <g transform="translate(285, 300)">
    <rect x="0" y="0" width="620" height="98" rx="10" fill="#15263a" stroke="#fbbf24" stroke-width="1.5" filter="url(#shadow)"/>
    <!-- Stage Badge & Title -->
    <rect x="20" y="10" width="64" height="22" rx="4" fill="#fbbf24"/>
    <text x="52" y="25" fill="#0b1927" font-size="11" font-weight="700" text-anchor="middle">STAGE 3</text>
    <text x="94" y="26" fill="#ffffff" font-size="14.5" font-weight="700">Re-ranking &amp; Business Rules (การจัดลำดับขั้นสุดท้าย)</text>
    <!-- Latency Pill -->
    <rect x="475" y="10" width="125" height="22" rx="4" fill="#3d2c0b" stroke="#fbbf24" stroke-width="1"/>
    <text x="537" y="25" fill="#fbbf24" font-size="11" font-weight="600" text-anchor="middle">⚖️ Latency: &lt; 5-10 ms</text>
    <!-- Card Details -->
    <text x="20" y="49" fill="#cbd5e1" font-size="12">• ขอบเขต: ~50 ชิ้น → คัดเหลือ Top-K (~10 - 20 ชิ้น) เพื่อแสดงผลบนหน้าจอจริง</text>
    <text x="20" y="68" fill="#94a3b8" font-size="11.5">• เทคนิค: MMR (Diversity), Deduplication, Freshness Boost, Category Balancing</text>
    <text x="20" y="87" fill="#fbbf24" font-size="11.5" font-weight="500">• หัวใจหลัก: กระจายความหลากหลาย กำจัดของซ้ำ และบังคับใช้กฎธุรกิจขององค์กร</text>
  </g>

  <!-- Summary Box (Exam Watch-Outs) -->
  <g transform="translate(285, 408)">
    <rect x="0" y="0" width="620" height="88" rx="10" fill="#0f1d2c" stroke="#253a52" stroke-width="1.5"/>
    <text x="20" y="22" fill="#38bdf8" font-size="12" font-weight="700">💡 หัวใจสำคัญและกับดักข้อสอบ (Exam Watch-Outs)</text>
    <text x="20" y="41" fill="#cbd5e1" font-size="11">• ทำไมไม่ใช้ Deep Learning ตั้งแต่แรก? เพราะคลังมีล้านชิ้น หากไม่แบ่งด่าน Latency จะเกิน 50ms</text>
    <text x="20" y="59" fill="#cbd5e1" font-size="11">• Rating Error (RMSE) ต่ำ ไม่การันตี Top-K เพราะผู้ใช้ดูเฉพาะอันดับบนสุด ไม่สนใจของอันดับล่าง</text>
    <text x="20" y="77" fill="#cbd5e1" font-size="11">• Re-ranking ขาดไม่ได้ เพราะโมเดล Scoring จะดันแต่ของฮิตซ้ำๆ จนเกิด Echo Chamber และเบื่อหน่าย</text>
  </g>
</svg>
