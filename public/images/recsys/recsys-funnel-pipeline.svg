<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 520" width="100%" height="100%">
  
    <defs>
      <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#15263a"/>
        <stop offset="100%" stop-color="#0f1d2c"/>
      </linearGradient>
      <linearGradient id="mintGrad" x1="0%" y1="0%" x2="100%" y2="0%">
        <stop offset="0%" stop-color="#5ee0c2"/>
        <stop offset="100%" stop-color="#38bdf8"/>
      </linearGradient>
      <linearGradient id="accentGrad" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%" stop-color="#38bdf8"/>
        <stop offset="100%" stop-color="#818cf8"/>
      </linearGradient>
      <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
        <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.35"/>
      </filter>
      <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M 0 1 L 10 5 L 0 9 z" fill="#5ee0c2" />
      </marker>
      <marker id="arrowSky" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M 0 1 L 10 5 L 0 9 z" fill="#38bdf8" />
      </marker>
      <marker id="arrowIndigo" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M 0 1 L 10 5 L 0 9 z" fill="#818cf8" />
      </marker>
    </defs>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
      .title { font-weight: 700; fill: #ffffff; }
      .subtitle { fill: #94a3b8; font-size: 13px; }
      .badge-text { font-size: 11px; font-weight: 600; text-anchor: middle; fill: #0b1927; }
      .card-title { font-size: 15px; font-weight: 600; fill: #5ee0c2; }
      .card-desc { font-size: 12.5px; fill: #cbd5e1; }
      .formula { font-family: "Courier New", monospace; font-size: 13px; fill: #fbbf24; }
      .axis { stroke: #475569; stroke-width: 1.5; }
      .grid { stroke: #1e293b; stroke-width: 1; stroke-dasharray: 4,4; }
    </style>

  <rect width="100%" height="100%" rx="14" fill="#0b1927" stroke="#253a52" stroke-width="1.5"/>
  
  <text x="40" y="42" class="title" font-size="20">The RecSys Multi-Stage Funnel: สถาปัตยกรรมระบบแนะนำระดับ Production</text>
  <text x="40" y="66" class="subtitle">การกรองผู้สมัครแบบกรวยหลายชั้นเพื่อสร้างสมดุลระหว่างความเร็วระดับมิลลิวินาที (Latency) และความแม่นยำสูงสุด (Accuracy)</text>

  <!-- Funnel Stage 1: Retrieval -->
  <g transform="translate(40, 95)">
    <path d="M 0 0 L 860 0 L 760 100 L 100 100 Z" fill="#15283c" stroke="#38bdf8" stroke-width="1.5" filter="url(#shadow)"/>
    <rect x="20" y="15" width="120" height="24" rx="12" fill="#38bdf8"/>
    <text x="80" y="31" class="badge-text">STAGE 1: RETRIEVAL</text>
    <text x="155" y="32" fill="#ffffff" font-weight="700" font-size="16">Candidate Generation (การค้นคืนผู้สมัคร)</text>
    <text x="155" y="55" fill="#94a3b8" font-size="12.5">คลังสินค้าทั้งหมด: 1,000,000+ ชิ้น → คัดเหลือ 1,000 ชิ้น | ใช้ Two-Tower, ANN (FAISS/HNSW), กรองหยาบ</text>
    <text x="155" y="78" fill="#38bdf8" font-weight="600" font-size="12">⚡ Latency งบประมาณ: &lt; 10 ms (เน้นความเร็วสูง ฟีเจอร์เบา)</text>
  </g>

  <!-- Funnel Stage 2: Scoring / Ranking -->
  <g transform="translate(140, 215)">
    <path d="M 0 0 L 660 0 L 540 100 L 120 100 Z" fill="#162e47" stroke="#5ee0c2" stroke-width="1.5" filter="url(#shadow)"/>
    <rect x="30" y="15" width="115" height="24" rx="12" fill="#5ee0c2"/>
    <text x="87" y="31" class="badge-text">STAGE 2: SCORING</text>
    <text x="160" y="32" fill="#ffffff" font-weight="700" font-size="16">Heavy Ranking (การให้คะแนนละเอียด)</text>
    <text x="160" y="55" fill="#94a3b8" font-size="12.5">ผู้สมัคร: 1,000 ชิ้น → คัดเหลือ 100 ชิ้น | ใช้ Deep Learning (DLRM, GBDT, Cross-Features, พฤติกรรมสด)</text>
    <text x="160" y="78" fill="#5ee0c2" font-weight="600" font-size="12">🎯 Latency งบประมาณ: 40 - 60 ms (เน้นความแม่นยำ ทาย pCTR / Engagement)</text>
  </g>

  <!-- Funnel Stage 3: Re-ranking / Post-Processing -->
  <g transform="translate(260, 335)">
    <path d="M 0 0 L 420 0 L 320 95 L 100 95 Z" fill="#1b3956" stroke="#fbbf24" stroke-width="1.5" filter="url(#shadow)"/>
    <rect x="25" y="15" width="125" height="24" rx="12" fill="#fbbf24"/>
    <text x="87" y="31" class="badge-text">STAGE 3: RE-RANK</text>
    <text x="165" y="32" fill="#ffffff" font-weight="700" font-size="15">Business Rules &amp; Diversity</text>
    <text x="165" y="54" fill="#94a3b8" font-size="12">100 ชิ้น → คัดเหลือ Top-10 บนหน้าจอ | กรองซ้ำ (Deduplication), MMR Diversity, Fairness</text>
    <text x="165" y="75" fill="#fbbf24" font-weight="600" font-size="12">⚖️ Latency: &lt; 15 ms (คุมความสดใหม่ ไม่ให้ซ้ำซาก)</text>
  </g>

  <!-- Output Box -->
  <g transform="translate(360, 450)">
    <rect x="0" y="0" width="220" height="42" rx="8" fill="#0f766e" stroke="#5ee0c2" stroke-width="1.5" filter="url(#shadow)"/>
    <text x="110" y="26" fill="#ffffff" font-weight="700" font-size="14" text-anchor="middle">✨ Final Top-K Display (10 ชิ้น)</text>
  </g>
</svg>