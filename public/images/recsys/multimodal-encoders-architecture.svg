<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 480" width="100%" height="100%">
  
    <defs>
      <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#15263a"/>
        <stop offset="100%" stop-color="#0f1d2c"/>
      </linearGradient>
      <linearGradient id="mintGrad" x1="0%" y1="0%" x2="100%" y2="0%">
        <stop offset="0%" stop-color="#5ee0c2"/>
        <stop offset="100%" stop-color="#38bdf8"/>
      </linearGradient>
      <linearGradient id="accentGrad" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%" stop-color="#38bdf8"/>
        <stop offset="100%" stop-color="#818cf8"/>
      </linearGradient>
      <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
        <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.35"/>
      </filter>
      <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M 0 1 L 10 5 L 0 9 z" fill="#5ee0c2" />
      </marker>
      <marker id="arrowSky" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M 0 1 L 10 5 L 0 9 z" fill="#38bdf8" />
      </marker>
      <marker id="arrowIndigo" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M 0 1 L 10 5 L 0 9 z" fill="#818cf8" />
      </marker>
    </defs>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
      .title { font-weight: 700; fill: #ffffff; }
      .subtitle { fill: #94a3b8; font-size: 13px; }
      .badge-text { font-size: 11px; font-weight: 600; text-anchor: middle; fill: #0b1927; }
      .card-title { font-size: 15px; font-weight: 600; fill: #5ee0c2; }
      .card-desc { font-size: 12.5px; fill: #cbd5e1; }
      .formula { font-family: "Courier New", monospace; font-size: 13px; fill: #fbbf24; }
      .axis { stroke: #475569; stroke-width: 1.5; }
      .grid { stroke: #1e293b; stroke-width: 1; stroke-dasharray: 4,4; }
    </style>

  <rect width="100%" height="100%" rx="14" fill="#0b1927" stroke="#253a52" stroke-width="1.5"/>

  <text x="40" y="42" class="title" font-size="20">Multimodal Encoders: สกัดฟีเจอร์จาก 3 สื่อสู่พื้นที่เวกเตอร์ร่วม</text>
  <text x="40" y="66" class="subtitle">สถาปัตยกรรมแปลงข้อความ (Text), รูปภาพโปสเตอร์ (Image) และคลิปเสียงตัวอย่าง (Audio) เป็น Dense Embeddings มิติเท่ากัน</text>

  <g transform="translate(40, 100)">
    <!-- Stream 1: Text -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="260" height="90" rx="8" fill="#15263a" stroke="#38bdf8" stroke-width="1.2"/>
      <text x="15" y="25" fill="#38bdf8" font-weight="700" font-size="13">📄 Text Modality (ชื่อ/เรื่องย่อ)</text>
      <text x="15" y="48" fill="#cbd5e1" font-size="11.5">Tokenizer → BERT / RoBERTa</text>
      <text x="15" y="70" class="formula" font-size="12">e_text ∈ ℝ^d (d = 256)</text>
    </g>

    <!-- Stream 2: Image -->
    <g transform="translate(0, 115)">
      <rect x="0" y="0" width="260" height="90" rx="8" fill="#15263a" stroke="#5ee0c2" stroke-width="1.2"/>
      <text x="15" y="25" fill="#5ee0c2" font-weight="700" font-size="13">🖼️ Image Modality (โปสเตอร์)</text>
      <text x="15" y="48" fill="#cbd5e1" font-size="11.5">Patch Extraction 16x16 → ViT / ResNet</text>
      <text x="15" y="70" class="formula" font-size="12">e_img ∈ ℝ^d (d = 256)</text>
    </g>

    <!-- Stream 3: Audio/Video -->
    <g transform="translate(0, 230)">
      <rect x="0" y="0" width="260" height="90" rx="8" fill="#15263a" stroke="#818cf8" stroke-width="1.2"/>
      <text x="15" y="25" fill="#818cf8" font-weight="700" font-size="13">🎵 Audio Modality (เสียงตัวอย่าง)</text>
      <text x="15" y="48" fill="#cbd5e1" font-size="11.5">Mel-Spectrogram → 1D-CNN / AST</text>
      <text x="15" y="70" class="formula" font-size="12">e_audio ∈ ℝ^d (d = 256)</text>
    </g>

    <!-- Flow Lines to Projection -->
    <line x1="260" y1="45" x2="350" y2="150" stroke="#38bdf8" stroke-width="2.5" marker-end="url(#arrowSky)"/>
    <line x1="260" y1="160" x2="350" y2="160" stroke="#5ee0c2" stroke-width="2.5" marker-end="url(#arrow)"/>
    <line x1="260" y1="275" x2="350" y2="170" stroke="#818cf8" stroke-width="2.5" marker-end="url(#arrowIndigo)"/>

    <!-- Center: Projection & Alignment -->
    <g transform="translate(360, 60)">
      <rect x="0" y="0" width="230" height="200" rx="10" fill="#162e47" stroke="#fbbf24" stroke-width="1.5" filter="url(#shadow)"/>
      <text x="115" y="30" fill="#fbbf24" font-weight="700" font-size="14" text-anchor="middle">Projection &amp; Alignment</text>
      <text x="115" y="55" fill="#cbd5e1" font-size="12" text-anchor="middle">ปรับขนาดมิติให้เท่ากัน (Projector)</text>
      <line x1="20" y1="70" x2="210" y2="70" stroke="#253a52"/>
      <text x="25" y="100" fill="#94a3b8" font-size="11">• LayerNorm &amp; Dropout</text>
      <text x="25" y="125" fill="#94a3b8" font-size="11">• Contrastive Alignment (CLIP loss)</text>
      <text x="25" y="150" fill="#94a3b8" font-size="11">• ปรับตำแหน่งให้สื่อเดียวกันอยู่ใกล้กัน</text>
      <text x="25" y="180" class="formula" font-size="11">W_t e_t ≈ W_i e_i</text>
    </g>

    <!-- Line to Output -->
    <line x1="590" y1="160" x2="650" y2="160" stroke="#5ee0c2" stroke-width="3" marker-end="url(#arrow)"/>

    <!-- Right: Unified Representation -->
    <g transform="translate(660, 40)">
      <rect x="0" y="0" width="200" height="240" rx="10" fill="#15263a" stroke="#5ee0c2" stroke-width="1.5" filter="url(#shadow)"/>
      <text x="100" y="30" fill="#5ee0c2" font-weight="700" font-size="14" text-anchor="middle">Unified Item Vector</text>
      <text x="100" y="50" fill="#94a3b8" font-size="11" text-anchor="middle">(เวกเตอร์สินค้าสมบูรณ์)</text>

      <rect x="20" y="70" width="160" height="40" rx="4" fill="#0f1d2c" stroke="#5ee0c2"/>
      <text x="100" y="95" class="formula" font-size="13" text-anchor="middle">z_item ∈ ℝ^512</text>

      <text x="20" y="140" fill="#cbd5e1" font-size="11.5">• แก้ปัญหา Cold Start</text>
      <text x="20" y="165" fill="#cbd5e1" font-size="11.5">• แม้ไม่มีคนกด แต่มีรูป</text>
      <text x="20" y="190" fill="#cbd5e1" font-size="11.5">• โมเดลก็เข้าใจสไตล์ได้ทันที</text>
    </g>
  </g>
</svg>