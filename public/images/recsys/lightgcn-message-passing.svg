<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 460" width="100%" height="100%">
  
    <defs>
      <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#15263a"/>
        <stop offset="100%" stop-color="#0f1d2c"/>
      </linearGradient>
      <linearGradient id="mintGrad" x1="0%" y1="0%" x2="100%" y2="0%">
        <stop offset="0%" stop-color="#5ee0c2"/>
        <stop offset="100%" stop-color="#38bdf8"/>
      </linearGradient>
      <linearGradient id="accentGrad" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%" stop-color="#38bdf8"/>
        <stop offset="100%" stop-color="#818cf8"/>
      </linearGradient>
      <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
        <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.35"/>
      </filter>
      <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M 0 1 L 10 5 L 0 9 z" fill="#5ee0c2" />
      </marker>
      <marker id="arrowSky" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M 0 1 L 10 5 L 0 9 z" fill="#38bdf8" />
      </marker>
      <marker id="arrowIndigo" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M 0 1 L 10 5 L 0 9 z" fill="#818cf8" />
      </marker>
    </defs>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
      .title { font-weight: 700; fill: #ffffff; }
      .subtitle { fill: #94a3b8; font-size: 13px; }
      .badge-text { font-size: 11px; font-weight: 600; text-anchor: middle; fill: #0b1927; }
      .card-title { font-size: 15px; font-weight: 600; fill: #5ee0c2; }
      .card-desc { font-size: 12.5px; fill: #cbd5e1; }
      .formula { font-family: "Courier New", monospace; font-size: 13px; fill: #fbbf24; }
      .axis { stroke: #475569; stroke-width: 1.5; }
      .grid { stroke: #1e293b; stroke-width: 1; stroke-dasharray: 4,4; }
    </style>

  <rect width="100%" height="100%" rx="14" fill="#0b1927" stroke="#253a52" stroke-width="1.5"/>

  <text x="40" y="42" class="title" font-size="20">LightGCN: กราฟคอนโวลูชันแบบตัดน้ำหนักส่วนเกิน</text>
  <text x="40" y="66" class="subtitle">ตัด Weight Matrix และ Activation Function ทิ้ง เหลือเพียงการรวมเฉลี่ยเวกเตอร์จากเพื่อนบ้านบน Bipartite Graph</text>

  <g transform="translate(60, 100)">
    <!-- Left: User Nodes -->
    <g transform="translate(60, 20)">
      <circle cx="30" cy="40" r="24" fill="#15263a" stroke="#38bdf8" stroke-width="2"/>
      <text x="30" y="45" fill="#38bdf8" font-weight="700" font-size="13" text-anchor="middle">u1</text>

      <circle cx="30" cy="130" r="24" fill="#15263a" stroke="#38bdf8" stroke-width="2"/>
      <text x="30" y="135" fill="#38bdf8" font-weight="700" font-size="13" text-anchor="middle">u2</text>

      <circle cx="30" cy="220" r="24" fill="#15263a" stroke="#38bdf8" stroke-width="2"/>
      <text x="30" y="225" fill="#38bdf8" font-weight="700" font-size="13" text-anchor="middle">u3</text>
      <text x="30" y="270" fill="#94a3b8" font-size="12" text-anchor="middle">ผู้ใช้ (Users)</text>
    </g>

    <!-- Graph Edges -->
    <line x1="114" y1="60" x2="256" y2="60" stroke="#5ee0c2" stroke-width="2"/>
    <line x1="114" y1="60" x2="256" y2="150" stroke="#5ee0c2" stroke-width="2"/>
    <line x1="114" y1="150" x2="256" y2="150" stroke="#5ee0c2" stroke-width="2"/>
    <line x1="114" y1="240" x2="256" y2="150" stroke="#5ee0c2" stroke-width="2"/>
    <line x1="114" y1="240" x2="256" y2="240" stroke="#5ee0c2" stroke-width="2"/>

    <!-- Right: Item Nodes -->
    <g transform="translate(250, 20)">
      <circle cx="30" cy="40" r="24" fill="#15263a" stroke="#5ee0c2" stroke-width="2"/>
      <text x="30" y="45" fill="#5ee0c2" font-weight="700" font-size="13" text-anchor="middle">i1</text>

      <circle cx="30" cy="130" r="24" fill="#15263a" stroke="#5ee0c2" stroke-width="2"/>
      <text x="30" y="135" fill="#5ee0c2" font-weight="700" font-size="13" text-anchor="middle">i2</text>

      <circle cx="30" cy="220" r="24" fill="#15263a" stroke="#5ee0c2" stroke-width="2"/>
      <text x="30" y="225" fill="#5ee0c2" font-weight="700" font-size="13" text-anchor="middle">i3</text>
      <text x="30" y="270" fill="#94a3b8" font-size="12" text-anchor="middle">สินค้า (Items)</text>
    </g>

    <!-- Middle: Aggregation Formula -->
    <g transform="translate(370, 30)">
      <rect x="0" y="0" width="430" height="230" rx="10" fill="#15263a" stroke="#304b65" stroke-width="1.2" filter="url(#shadow)"/>
      <text x="25" y="32" class="card-title">หัวใจของ LightGCN (Linear Message Passing):</text>

      <rect x="20" y="50" width="390" height="60" rx="6" fill="#0f1d2c" stroke="#5ee0c2"/>
      <text x="35" y="85" class="formula" font-size="13">e_u^(k+1) = Σ [ 1 / √(|N_u| · |N_i|) ] · e_i^(k)</text>

      <text x="25" y="135" fill="#cbd5e1" font-size="12">• ไม่ใช้ Weight Matrix (W) → ลดพารามิเตอร์ โมเดลไม่ Overfit</text>
      <text x="25" y="158" fill="#cbd5e1" font-size="12">• ไม่ใช้ Non-linear Activation (เช่น ReLU) → เทรนเร็วกว่า 3-5 เท่า</text>
      <text x="25" y="182" fill="#cbd5e1" font-size="12">• Layer Combination รวมทุกชั้น: e_u* = Σ α_k e_u^(k)</text>

      <text x="25" y="212" fill="#fbbf24" font-weight="600" font-size="12.5">⭐ มาตรฐาน SOTA ในกลุ่ม Collaborative Filtering แบบกราฟ</text>
    </g>
  </g>
</svg>