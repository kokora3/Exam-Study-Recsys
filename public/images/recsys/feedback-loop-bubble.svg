<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 480" width="100%" height="100%">
  <defs>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#15263a"/>
      <stop offset="100%" stop-color="#0f1d2c"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#5ee0c2" />
    </marker>
    <marker id="arrowSky" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#38bdf8" />
    </marker>
    <marker id="arrowIndigo" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#818cf8" />
    </marker>
    <marker id="arrowRose" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#f43f5e" />
    </marker>
    <marker id="arrowAmber" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#fbbf24" />
    </marker>
  </defs>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Sarabun", "Noto Sans Thai", sans-serif; }
    .title { font-weight: 700; fill: #ffffff; }
    .subtitle { fill: #94a3b8; font-size: 12.5px; }
  </style>

  <rect width="100%" height="100%" rx="14" fill="#0b1927" stroke="#253a52" stroke-width="1.5"/>

  <!-- Main Header -->
  <text x="40" y="38" class="title" font-size="19">วงจรสะท้อนกลับ (Feedback Loop &amp; Filter Bubble Dynamics)</text>
  <text x="40" y="60" class="subtitle">เมื่อพฤติกรรมผู้ใช้เกิดจากการชี้นำของระบบ หากไม่แทรกการสำรวจ (Exploration) มุมมองของผู้ใช้จะตีบแคบลงเรื่อยๆ</text>

  <!-- Cycle Nodes -->
  <!-- Node 1: Recommendation (Top) -->
  <g transform="translate(345, 82)">
    <rect x="0" y="0" width="230" height="74" rx="10" fill="#15263a" stroke="#38bdf8" stroke-width="1.5" filter="url(#shadow)"/>
    <text x="115" y="23" fill="#38bdf8" font-size="11" font-weight="700" text-anchor="middle">🤖 1. MODEL RECOMMENDATION</text>
    <text x="115" y="44" fill="#ffffff" font-size="13.5" font-weight="700" text-anchor="middle">ระบบแนะนำเฉพาะสินค้าคะแนนสูง</text>
    <text x="115" y="63" fill="#94a3b8" font-size="11" text-anchor="middle">ผลักดันแต่ของที่ระบบคิดว่าผู้ใช้ชอบ</text>
  </g>

  <!-- Arrow 1 -> 2 (Top to Right) -->
  <path d="M 575 119 C 690 119, 772 145, 772 196" fill="none" stroke="#38bdf8" stroke-width="2.5" marker-end="url(#arrowSky)"/>
  <rect x="655" y="132" width="105" height="20" rx="4" fill="#0e304f" stroke="#38bdf8" stroke-width="0.8"/>
  <text x="707" y="146" fill="#38bdf8" font-size="10" font-weight="600" text-anchor="middle">แสดงผลบนหน้าจอ</text>

  <!-- Node 2: User Action (Right) -->
  <g transform="translate(665, 204)">
    <rect x="0" y="0" width="215" height="74" rx="10" fill="#15263a" stroke="#5ee0c2" stroke-width="1.5" filter="url(#shadow)"/>
    <text x="107" y="23" fill="#5ee0c2" font-size="11" font-weight="700" text-anchor="middle">👆 2. USER INTERACTION</text>
    <text x="107" y="44" fill="#ffffff" font-size="13.5" font-weight="700" text-anchor="middle">ผู้ใช้คลิก / มีปฏิสัมพันธ์</text>
    <text x="107" y="63" fill="#94a3b8" font-size="11" text-anchor="middle">คลิกเพราะถูกนำมาโชว์ (Exposure Bias)</text>
  </g>

  <!-- Arrow 2 -> 3 (Right to Bottom) -->
  <path d="M 772 278 C 772 328, 690 353, 581 353" fill="none" stroke="#5ee0c2" stroke-width="2.5" marker-end="url(#arrow)"/>
  <rect x="655" y="324" width="105" height="20" rx="4" fill="#0c3938" stroke="#5ee0c2" stroke-width="0.8"/>
  <text x="707" y="338" fill="#5ee0c2" font-size="10" font-weight="600" text-anchor="middle">บันทึกประวัติคลิก</text>

  <!-- Node 3: Retraining (Bottom) -->
  <g transform="translate(345, 316)">
    <rect x="0" y="0" width="230" height="74" rx="10" fill="#15263a" stroke="#818cf8" stroke-width="1.5" filter="url(#shadow)"/>
    <text x="115" y="23" fill="#818cf8" font-size="11" font-weight="700" text-anchor="middle">🔄 3. BIASED RETRAINING</text>
    <text x="115" y="44" fill="#ffffff" font-size="13.5" font-weight="700" text-anchor="middle">นำข้อมูลเดิมมาเทรนโมเดลใหม่</text>
    <text x="115" y="63" fill="#94a3b8" font-size="11" text-anchor="middle">โมเดลเข้าใจผิดว่าผู้ใช้ชอบเฉพาะสิ่งนี้</text>
  </g>

  <!-- Arrow 3 -> 4 (Bottom to Left) -->
  <path d="M 345 353 C 230 353, 147 328, 147 284" fill="none" stroke="#818cf8" stroke-width="2.5" marker-end="url(#arrowIndigo)"/>
  <rect x="160" y="324" width="112" height="20" rx="4" fill="#25244e" stroke="#818cf8" stroke-width="0.8"/>
  <text x="216" y="338" fill="#818cf8" font-size="10" font-weight="600" text-anchor="middle">ส่งข้อมูลที่มี Bias ซ้ำ</text>

  <!-- Node 4: Echo Chamber / Filter Bubble (Left) -->
  <g transform="translate(40, 204)">
    <rect x="0" y="0" width="215" height="74" rx="10" fill="#15263a" stroke="#f43f5e" stroke-width="1.5" filter="url(#shadow)"/>
    <text x="107" y="23" fill="#f43f5e" font-size="11" font-weight="700" text-anchor="middle">🌪️ 4. FILTER BUBBLE</text>
    <text x="107" y="44" fill="#ffffff" font-size="13.5" font-weight="700" text-anchor="middle">เกิดฟองสบู่ปิดกั้นรสนิยม</text>
    <text x="107" y="63" fill="#fca5a5" font-size="11" text-anchor="middle">สินค้าอื่น 90% ในคลังถูกตัดทิ้งถาวร</text>
  </g>

  <!-- Arrow 4 -> 1 (Left to Top) -->
  <path d="M 147 204 C 147 145, 230 119, 339 119" fill="none" stroke="#f43f5e" stroke-width="2.5" marker-end="url(#arrowRose)"/>
  <rect x="160" y="132" width="112" height="20" rx="4" fill="#3e1a26" stroke="#f43f5e" stroke-width="0.8"/>
  <text x="216" y="146" fill="#f43f5e" font-size="10" font-weight="600" text-anchor="middle">ยิ่งแนะนำแคบลงเรื่อยๆ</text>

  <!-- Center Callout: Mitigation & Engineering Solutions -->
  <g transform="translate(285, 182)">
    <rect x="0" y="0" width="350" height="110" rx="10" fill="#0f1d2c" stroke="#fbbf24" stroke-width="1.5" filter="url(#shadow)"/>
    <rect x="75" y="12" width="200" height="22" rx="11" fill="#3d2c0b" stroke="#fbbf24" stroke-width="1"/>
    <text x="175" y="27" fill="#fbbf24" font-size="11.5" font-weight="700" text-anchor="middle">💡 วิธีแก้ทางวิศวกรรม (Mitigation)</text>
    <text x="175" y="52" fill="#cbd5e1" font-size="11" text-anchor="middle">• Exploration: สุ่มแทรกสินค้า Long-Tail (ε-Greedy, Bandits)</text>
    <text x="175" y="72" fill="#cbd5e1" font-size="11" text-anchor="middle">• Exposure Logging: บันทึกของที่ถูกโชว์แต่ไม่ถูกคลิก (Impression Logs)</text>
    <text x="175" y="93" fill="#5ee0c2" font-size="11" font-weight="600" text-anchor="middle">• Debias Model: ใช้ Inverse Propensity Scoring (IPS) ถ่วงน้ำหนักแก้อคติ</text>
  </g>

  <!-- Bottom Summary Banner -->
  <g transform="translate(40, 412)">
    <rect x="0" y="0" width="840" height="50" rx="8" fill="#0f1d2c" stroke="#253a52" stroke-width="1"/>
    <text x="420" y="21" fill="#fbbf24" font-size="11.5" font-weight="700" text-anchor="middle">🎯 สรุปหลักการทำข้อสอบ (Exam Rule):</text>
    <text x="420" y="39" fill="#cbd5e1" font-size="11" text-anchor="middle">Feedback Loop เกิดจากโมเดลเทรนด้วยข้อมูลที่ตนเองชี้นำ (Self-Fulfilling Prophecy) แก้ด้วย Exposure Log + Exploration เสมอ</text>
  </g>
</svg>
