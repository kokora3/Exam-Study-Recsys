<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 480" width="100%" height="100%">
  
    <defs>
      <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#15263a"/>
        <stop offset="100%" stop-color="#0f1d2c"/>
      </linearGradient>
      <linearGradient id="mintGrad" x1="0%" y1="0%" x2="100%" y2="0%">
        <stop offset="0%" stop-color="#5ee0c2"/>
        <stop offset="100%" stop-color="#38bdf8"/>
      </linearGradient>
      <linearGradient id="accentGrad" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%" stop-color="#38bdf8"/>
        <stop offset="100%" stop-color="#818cf8"/>
      </linearGradient>
      <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
        <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.35"/>
      </filter>
      <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M 0 1 L 10 5 L 0 9 z" fill="#5ee0c2" />
      </marker>
      <marker id="arrowSky" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M 0 1 L 10 5 L 0 9 z" fill="#38bdf8" />
      </marker>
      <marker id="arrowIndigo" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M 0 1 L 10 5 L 0 9 z" fill="#818cf8" />
      </marker>
    </defs>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
      .title { font-weight: 700; fill: #ffffff; }
      .subtitle { fill: #94a3b8; font-size: 13px; }
      .badge-text { font-size: 11px; font-weight: 600; text-anchor: middle; fill: #0b1927; }
      .card-title { font-size: 15px; font-weight: 600; fill: #5ee0c2; }
      .card-desc { font-size: 12.5px; fill: #cbd5e1; }
      .formula { font-family: "Courier New", monospace; font-size: 13px; fill: #fbbf24; }
      .axis { stroke: #475569; stroke-width: 1.5; }
      .grid { stroke: #1e293b; stroke-width: 1; stroke-dasharray: 4,4; }
    </style>

  <rect width="100%" height="100%" rx="14" fill="#0b1927" stroke="#253a52" stroke-width="1.5"/>

  <text x="40" y="42" class="title" font-size="20">Attention Mechanism: ระบบสปอตไลต์ Query ถาม Key แล้วรวม Value</text>
  <text x="40" y="66" class="subtitle">Query (ความสนใจของผู้ใช้ขณะนี้) ส่องไฟเทียบกับ Key ของแต่ละสื่อ เพื่อคำนวณ Attention Weight แล้วดึงสาระจาก Value มารวมกัน</text>

  <g transform="translate(60, 100)">
    <!-- Query Box -->
    <g transform="translate(0, 20)">
      <rect x="0" y="0" width="160" height="90" rx="8" fill="#15263a" stroke="#fbbf24" stroke-width="1.5" filter="url(#shadow)"/>
      <text x="80" y="30" fill="#fbbf24" font-weight="700" font-size="14" text-anchor="middle">Query (Q)</text>
      <text x="80" y="55" fill="#cbd5e1" font-size="11.5" text-anchor="middle">สิ่งที่ระบบกำลังมองหา</text>
      <text x="80" y="75" class="formula" font-size="12" text-anchor="middle">[ความต้องการขณะนี้]</text>
    </g>

    <!-- Key Box -->
    <g transform="translate(0, 160)">
      <rect x="0" y="0" width="160" height="120" rx="8" fill="#15263a" stroke="#38bdf8" stroke-width="1.5" filter="url(#shadow)"/>
      <text x="80" y="28" fill="#38bdf8" font-weight="700" font-size="14" text-anchor="middle">Keys (K)</text>
      <text x="80" y="50" fill="#cbd5e1" font-size="11" text-anchor="middle">ป้ายกำกับของแต่ละสื่อ</text>
      <text x="15" y="75" fill="#94a3b8" font-size="10.5">• K1: คีย์ข้อความ</text>
      <text x="15" y="92" fill="#94a3b8" font-size="10.5">• K2: คีย์รูปภาพ</text>
      <text x="15" y="110" fill="#94a3b8" font-size="10.5">• K3: คีย์เสียง</text>
    </g>

    <!-- Center: Dot-Product & Softmax -->
    <g transform="translate(240, 70)">
      <rect x="0" y="0" width="220" height="150" rx="10" fill="#162e47" stroke="#5ee0c2" stroke-width="1.5" filter="url(#shadow)"/>
      <text x="110" y="28" fill="#5ee0c2" font-weight="700" font-size="14" text-anchor="middle">1. Scaled Dot-Product</text>
      <text x="110" y="55" class="formula" font-size="14" text-anchor="middle">Score = (Q · K^T) / √d_k</text>
      <line x1="20" y1="70" x2="200" y2="70" stroke="#253a52"/>
      <text x="110" y="95" fill="#ffffff" font-weight="600" font-size="13" text-anchor="middle">2. Softmax Normalization</text>
      <text x="110" y="125" class="formula" font-size="13" text-anchor="middle">α = Softmax(Score)</text>
    </g>

    <!-- Connectors -->
    <line x1="160" y1="65" x2="240" y2="120" stroke="#fbbf24" stroke-width="2" marker-end="url(#arrow)"/>
    <line x1="160" y1="200" x2="240" y2="170" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrowSky)"/>

    <!-- Weights α -->
    <g transform="translate(500, 75)">
      <rect x="0" y="0" width="120" height="140" rx="8" fill="#15263a" stroke="#fbbf24" stroke-width="1.2"/>
      <text x="60" y="25" fill="#fbbf24" font-weight="700" font-size="12" text-anchor="middle">Weights (α)</text>
      <rect x="15" y="40" width="90" height="22" rx="4" fill="#0f1d2c"/>
      <text x="60" y="56" fill="#5ee0c2" font-size="11" text-anchor="middle">α1 (Text): 0.70</text>
      <rect x="15" y="70" width="90" height="22" rx="4" fill="#0f1d2c"/>
      <text x="60" y="86" fill="#38bdf8" font-size="11" text-anchor="middle">α2 (Img): 0.25</text>
      <rect x="15" y="100" width="90" height="22" rx="4" fill="#0f1d2c"/>
      <text x="60" y="116" fill="#818cf8" font-size="11" text-anchor="middle">α3 (Aud): 0.05</text>
    </g>

    <!-- Line to Value Multiplication -->
    <line x1="460" y1="145" x2="500" y2="145" stroke="#5ee0c2" stroke-width="2.5" marker-end="url(#arrow)"/>
    <line x1="620" y1="145" x2="670" y2="145" stroke="#5ee0c2" stroke-width="2.5" marker-end="url(#arrow)"/>

    <!-- Values & Output -->
    <g transform="translate(670, 60)">
      <rect x="0" y="0" width="160" height="170" rx="10" fill="#15263a" stroke="#5ee0c2" stroke-width="1.5" filter="url(#shadow)"/>
      <text x="80" y="30" fill="#5ee0c2" font-weight="700" font-size="13" text-anchor="middle">Values (V) &amp; Out</text>
      <text x="80" y="55" fill="#cbd5e1" font-size="11" text-anchor="middle">Output = Σ α_i · V_i</text>
      <rect x="15" y="75" width="130" height="75" rx="6" fill="#0f1d2c" stroke="#5ee0c2"/>
      <text x="80" y="100" fill="#fbbf24" font-weight="600" font-size="11.5" text-anchor="middle">Context Vector</text>
      <text x="80" y="125" fill="#94a3b8" font-size="10.5" text-anchor="middle">ดึงเนื้อหาเน้น Text 70%</text>
      <text x="80" y="140" fill="#94a3b8" font-size="10.5" text-anchor="middle">ตามที่ผู้ใช้สนใจ</text>
    </g>
  </g>
</svg>