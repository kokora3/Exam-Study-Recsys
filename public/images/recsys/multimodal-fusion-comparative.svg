<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 500" width="100%" height="100%">
  
    <defs>
      <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#15263a"/>
        <stop offset="100%" stop-color="#0f1d2c"/>
      </linearGradient>
      <linearGradient id="mintGrad" x1="0%" y1="0%" x2="100%" y2="0%">
        <stop offset="0%" stop-color="#5ee0c2"/>
        <stop offset="100%" stop-color="#38bdf8"/>
      </linearGradient>
      <linearGradient id="accentGrad" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%" stop-color="#38bdf8"/>
        <stop offset="100%" stop-color="#818cf8"/>
      </linearGradient>
      <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
        <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.35"/>
      </filter>
      <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M 0 1 L 10 5 L 0 9 z" fill="#5ee0c2" />
      </marker>
      <marker id="arrowSky" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M 0 1 L 10 5 L 0 9 z" fill="#38bdf8" />
      </marker>
      <marker id="arrowIndigo" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M 0 1 L 10 5 L 0 9 z" fill="#818cf8" />
      </marker>
    </defs>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
      .title { font-weight: 700; fill: #ffffff; }
      .subtitle { fill: #94a3b8; font-size: 13px; }
      .badge-text { font-size: 11px; font-weight: 600; text-anchor: middle; fill: #0b1927; }
      .card-title { font-size: 15px; font-weight: 600; fill: #5ee0c2; }
      .card-desc { font-size: 12.5px; fill: #cbd5e1; }
      .formula { font-family: "Courier New", monospace; font-size: 13px; fill: #fbbf24; }
      .axis { stroke: #475569; stroke-width: 1.5; }
      .grid { stroke: #1e293b; stroke-width: 1; stroke-dasharray: 4,4; }
    </style>

  <rect width="100%" height="100%" rx="14" fill="#0b1927" stroke="#253a52" stroke-width="1.5"/>

  <text x="40" y="42" class="title" font-size="20">Early vs Late vs Intermediate Fusion: เปรียบเทียบ 3 สถาปัตยกรรมรวมสื่อ</text>
  <text x="40" y="66" class="subtitle">การเลือกระดับชั้นของการหลอมรวมสารสนเทศ (Feature vs Decision vs Representation Level) มีผลต่อพลังและความยืดหยุ่น</text>

  <!-- 3 Panels -->
  <!-- Panel 1: Early Fusion -->
  <g transform="translate(30, 95)">
    <rect x="0" y="0" width="275" height="370" rx="10" fill="#15263a" stroke="#38bdf8" stroke-width="1.5" filter="url(#shadow)"/>
    <rect x="15" y="15" width="105" height="22" rx="11" fill="#38bdf8"/>
    <text x="67" y="30" class="badge-text">EARLY FUSION</text>
    <text x="15" y="62" fill="#ffffff" font-weight="700" font-size="15">Feature-Level Fusion</text>

    <!-- Inputs -->
    <rect x="20" y="80" width="70" height="28" rx="4" fill="#0f1d2c" stroke="#38bdf8"/>
    <text x="55" y="98" fill="#38bdf8" font-size="11" text-anchor="middle">Text (xt)</text>
    <rect x="100" y="80" width="70" height="28" rx="4" fill="#0f1d2c" stroke="#5ee0c2"/>
    <text x="135" y="98" fill="#5ee0c2" font-size="11" text-anchor="middle">Image (xi)</text>
    <rect x="180" y="80" width="70" height="28" rx="4" fill="#0f1d2c" stroke="#818cf8"/>
    <text x="215" y="98" fill="#818cf8" font-size="11" text-anchor="middle">Audio (xa)</text>

    <!-- Concatenation -->
    <line x1="135" y1="108" x2="135" y2="135" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrowSky)"/>
    <rect x="30" y="135" width="215" height="35" rx="6" fill="#1e3a5a" stroke="#38bdf8"/>
    <text x="137" y="157" fill="#ffffff" font-weight="600" font-size="12" text-anchor="middle">Concat: [xt || xi || xa]</text>

    <!-- Model -->
    <line x1="135" y1="170" x2="135" y2="195" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrowSky)"/>
    <rect x="40" y="195" width="195" height="60" rx="6" fill="#162e47" stroke="#38bdf8"/>
    <text x="137" y="222" fill="#38bdf8" font-weight="700" font-size="13" text-anchor="middle">Single Complex Model</text>
    <text x="137" y="242" fill="#94a3b8" font-size="11" text-anchor="middle">Deep Neural Network</text>

    <!-- Output -->
    <line x1="135" y1="255" x2="135" y2="280" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrowSky)"/>
    <rect x="65" y="280" width="145" height="30" rx="4" fill="#0f766e"/>
    <text x="137" y="300" fill="#ffffff" font-weight="700" font-size="12" text-anchor="middle">Predict Score</text>

    <text x="15" y="335" fill="#94a3b8" font-size="11">ข้อดี: เรียนความสัมพันธ์ข้ามสื่อได้เร็ว</text>
    <text x="15" y="355" fill="#f43f5e" font-size="11">ข้อเสีย: ถ้าสื่อใดสื่อหนึ่งหาย โมเดลพัง</text>
  </g>

  <!-- Panel 2: Late Fusion -->
  <g transform="translate(330, 95)">
    <rect x="0" y="0" width="275" height="370" rx="10" fill="#15263a" stroke="#5ee0c2" stroke-width="1.5" filter="url(#shadow)"/>
    <rect x="15" y="15" width="95" height="22" rx="11" fill="#5ee0c2"/>
    <text x="62" y="30" class="badge-text">LATE FUSION</text>
    <text x="15" y="62" fill="#ffffff" font-weight="700" font-size="15">Decision-Level Fusion</text>

    <!-- Separate Models -->
    <rect x="15" y="85" width="75" height="65" rx="6" fill="#0f1d2c" stroke="#38bdf8"/>
    <text x="52" y="105" fill="#38bdf8" font-size="11" text-anchor="middle">Model Text</text>
    <text x="52" y="135" class="formula" font-size="10.5" text-anchor="middle">s_text</text>

    <rect x="100" y="85" width="75" height="65" rx="6" fill="#0f1d2c" stroke="#5ee0c2"/>
    <text x="137" y="105" fill="#5ee0c2" font-size="11" text-anchor="middle">Model Img</text>
    <text x="137" y="135" class="formula" font-size="10.5" text-anchor="middle">s_img</text>

    <rect x="185" y="85" width="75" height="65" rx="6" fill="#0f1d2c" stroke="#818cf8"/>
    <text x="222" y="105" fill="#818cf8" font-size="11" text-anchor="middle">Model Aud</text>
    <text x="222" y="135" class="formula" font-size="10.5" text-anchor="middle">s_aud</text>

    <!-- Blender -->
    <path d="M 52 150 L 137 195 M 137 150 L 137 195 M 222 150 L 137 195" stroke="#5ee0c2" stroke-width="1.5"/>
    <rect x="35" y="195" width="205" height="55" rx="6" fill="#162e47" stroke="#5ee0c2"/>
    <text x="137" y="218" fill="#5ee0c2" font-weight="700" font-size="13" text-anchor="middle">Score Blender (ถ่วงน้ำหนัก)</text>
    <text x="137" y="238" class="formula" font-size="11" text-anchor="middle">Score = w1 s1 + w2 s2 + w3 s3</text>

    <!-- Output -->
    <line x1="137" y1="250" x2="137" y2="280" stroke="#5ee0c2" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="65" y="280" width="145" height="30" rx="4" fill="#0f766e"/>
    <text x="137" y="300" fill="#ffffff" font-weight="700" font-size="12" text-anchor="middle">Final Decision</text>

    <text x="15" y="335" fill="#94a3b8" font-size="11">ข้อดี: ยืดหยุ่น สื่อหายก็ข้ามโมเดลนั้นได้</text>
    <text x="15" y="355" fill="#f43f5e" font-size="11">ข้อเสีย: ไม่เห็นปฏิสัมพันธ์ระดับลึกข้ามสื่อ</text>
  </g>

  <!-- Panel 3: Intermediate Fusion -->
  <g transform="translate(630, 95)">
    <rect x="0" y="0" width="280" height="370" rx="10" fill="#15263a" stroke="#fbbf24" stroke-width="1.5" filter="url(#shadow)"/>
    <rect x="15" y="15" width="150" height="22" rx="11" fill="#fbbf24"/>
    <text x="90" y="30" class="badge-text">INTERMEDIATE FUSION</text>
    <text x="15" y="62" fill="#ffffff" font-weight="700" font-size="15">Cross-Attention &amp; Gating</text>

    <!-- Layers with cross talk -->
    <rect x="25" y="85" width="105" height="50" rx="4" fill="#0f1d2c" stroke="#38bdf8"/>
    <text x="77" y="115" fill="#38bdf8" font-size="11" text-anchor="middle">Text Encoder</text>

    <rect x="150" y="85" width="105" height="50" rx="4" fill="#0f1d2c" stroke="#5ee0c2"/>
    <text x="202" y="115" fill="#5ee0c2" font-size="11" text-anchor="middle">Image Encoder</text>

    <!-- Cross Attention Bridge -->
    <g transform="translate(25, 150)">
      <rect x="0" y="0" width="230" height="72" rx="6" fill="#1b3956" stroke="#fbbf24"/>
      <text x="115" y="24" fill="#fbbf24" font-weight="700" font-size="12" text-anchor="middle">Cross-Attention Block</text>
      <text x="115" y="44" fill="#cbd5e1" font-size="11" text-anchor="middle">คำภาพถามคำอธิบายในรูป</text>
      <text x="115" y="61" class="formula" font-size="10" text-anchor="middle">h_fuse = GatedFusion(ht, hi)</text>
    </g>

    <!-- Output -->
    <line x1="140" y1="220" x2="140" y2="280" stroke="#fbbf24" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="65" y="280" width="150" height="30" rx="4" fill="#0f766e"/>
    <text x="140" y="300" fill="#ffffff" font-weight="700" font-size="12" text-anchor="middle">Optimal Representation</text>

    <text x="15" y="335" fill="#5ee0c2" font-size="11">ข้อดี: จุดสมดุลสูงสุด แม่นยำระดับ SOTA</text>
    <text x="15" y="355" fill="#94a3b8" font-size="11">เหมาะกับ: โมเดลขนาดใหญ่ที่ต้องการเจาะลึก</text>
  </g>
</svg>