<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 500" width="100%" height="100%">
  <defs>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#15263a"/>
      <stop offset="100%" stop-color="#0f1d2c"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#5ee0c2" />
    </marker>
    <marker id="arrowSky" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#38bdf8" />
    </marker>
    <marker id="arrowAmber" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#fbbf24" />
    </marker>
  </defs>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Sarabun", "Noto Sans Thai", sans-serif; }
    .title { font-weight: 700; fill: #ffffff; }
    .subtitle { fill: #94a3b8; font-size: 12px; }
    .formula { font-family: "Courier New", monospace; }
  </style>

  <rect width="100%" height="100%" rx="14" fill="#0b1927" stroke="#253a52" stroke-width="1.5"/>

  <!-- Main Header -->
  <text x="40" y="38" class="title" font-size="19">เปรียบเทียบสถาปัตยกรรมผสานสื่อ: Early vs Late vs Intermediate Fusion</text>
  <text x="40" y="60" class="subtitle">การเลือกระดับชั้นของการหลอมรวมสารสนเทศ (Feature vs Decision vs Representation Level) มีผลต่อพลังและความยืดหยุ่น</text>

  <!-- 3 PANELS -->

  <!-- ==================== PANEL 1: EARLY FUSION ==================== -->
  <g transform="translate(25, 75)">
    <rect x="0" y="0" width="286" height="415" rx="10" fill="#15263a" stroke="#38bdf8" stroke-width="1.5" filter="url(#shadow)"/>
    <!-- Badge & Paradigm Title -->
    <rect x="15" y="14" width="105" height="22" rx="11" fill="#38bdf8"/>
    <text x="67" y="29" fill="#0b1927" font-size="10.5" font-weight="700" text-anchor="middle">EARLY FUSION</text>
    <text x="15" y="55" fill="#ffffff" font-size="14.5" font-weight="700">Feature-Level Fusion</text>
    <text x="15" y="71" fill="#94a3b8" font-size="11">รวมเวกเตอร์ฟีเจอร์ตั้งแต่ต้นทาง</text>

    <!-- Raw Inputs -->
    <rect x="16" y="86" width="76" height="28" rx="4" fill="#0f1d2c" stroke="#38bdf8"/>
    <text x="54" y="104" fill="#38bdf8" font-size="11" text-anchor="middle">Text (xt)</text>

    <rect x="105" y="86" width="76" height="28" rx="4" fill="#0f1d2c" stroke="#5ee0c2"/>
    <text x="143" y="104" fill="#5ee0c2" font-size="11" text-anchor="middle">Image (xi)</text>

    <rect x="194" y="86" width="76" height="28" rx="4" fill="#0f1d2c" stroke="#818cf8"/>
    <text x="232" y="104" fill="#818cf8" font-size="11" text-anchor="middle">Audio (xa)</text>

    <!-- Lines down to Concat -->
    <path d="M 54 114 L 120 135 M 143 114 L 143 135 M 232 114 L 166 135" stroke="#38bdf8" stroke-width="1.5"/>

    <!-- Concat Block -->
    <rect x="24" y="137" width="238" height="34" rx="6" fill="#1e3a5a" stroke="#38bdf8"/>
    <text x="143" y="158" fill="#ffffff" font-size="12" font-weight="700" text-anchor="middle">Concat: [ xt ∥ xi ∥ xa ]</text>

    <!-- Arrow down to Model -->
    <line x1="143" y1="171" x2="143" y2="191" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrowSky)"/>

    <!-- Single Model -->
    <rect x="28" y="193" width="230" height="52" rx="6" fill="#162e47" stroke="#38bdf8"/>
    <text x="143" y="214" fill="#38bdf8" font-size="12.5" font-weight="700" text-anchor="middle">Single Complex Model</text>
    <text x="143" y="233" fill="#94a3b8" font-size="10.5" text-anchor="middle">(Deep Neural Network / MLP)</text>

    <!-- Arrow down to Output -->
    <line x1="143" y1="245" x2="143" y2="265" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrowSky)"/>

    <!-- Output -->
    <rect x="58" y="265" width="170" height="30" rx="5" fill="#0f766e" stroke="#5ee0c2"/>
    <text x="143" y="284" fill="#ffffff" font-size="11.5" font-weight="700" text-anchor="middle">🎯 Predict Score / Rank</text>

    <!-- Pros & Cons Card -->
    <rect x="14" y="308" width="258" height="92" rx="8" fill="#0f1d2c" stroke="#253a52"/>
    <text x="24" y="328" fill="#38bdf8" font-size="11" font-weight="700">✅ ข้อดี: จุดเด่นสำคัญ</text>
    <text x="24" y="346" fill="#cbd5e1" font-size="10.5">• เรียนความสัมพันธ์ข้ามสื่อได้เร็วและตรงไปตรงมา</text>
    <text x="24" y="369" fill="#f43f5e" font-size="11" font-weight="700">⚠️ ข้อจำกัด / จุดอ่อน</text>
    <text x="24" y="387" fill="#fca5a5" font-size="10.5">• มิติเวกเตอร์สูงมาก ถ้าสื่อใดหาย (Missing) พังทันที</text>
  </g>

  <!-- ==================== PANEL 2: LATE FUSION ==================== -->
  <g transform="translate(327, 75)">
    <rect x="0" y="0" width="286" height="415" rx="10" fill="#15263a" stroke="#5ee0c2" stroke-width="1.5" filter="url(#shadow)"/>
    <!-- Badge & Paradigm Title -->
    <rect x="15" y="14" width="95" height="22" rx="11" fill="#5ee0c2"/>
    <text x="62" y="29" fill="#0b1927" font-size="10.5" font-weight="700" text-anchor="middle">LATE FUSION</text>
    <text x="15" y="55" fill="#ffffff" font-size="14.5" font-weight="700">Decision-Level Fusion</text>
    <text x="15" y="71" fill="#94a3b8" font-size="11">แยกโมเดลให้คะแนน แล้วค่อยรวมผล</text>

    <!-- 3 Separate Models -->
    <rect x="14" y="86" width="80" height="60" rx="6" fill="#0f1d2c" stroke="#38bdf8"/>
    <text x="54" y="104" fill="#38bdf8" font-size="11" font-weight="700" text-anchor="middle">Model Text</text>
    <text x="54" y="121" fill="#94a3b8" font-size="10" text-anchor="middle">ทำนายคะแนน</text>
    <text x="54" y="137" fill="#fbbf24" font-size="10.5" class="formula" text-anchor="middle">s_txt</text>

    <rect x="103" y="86" width="80" height="60" rx="6" fill="#0f1d2c" stroke="#5ee0c2"/>
    <text x="143" y="104" fill="#5ee0c2" font-size="11" font-weight="700" text-anchor="middle">Model Img</text>
    <text x="143" y="121" fill="#94a3b8" font-size="10" text-anchor="middle">ทำนายคะแนน</text>
    <text x="143" y="137" fill="#fbbf24" font-size="10.5" class="formula" text-anchor="middle">s_img</text>

    <rect x="192" y="86" width="80" height="60" rx="6" fill="#0f1d2c" stroke="#818cf8"/>
    <text x="232" y="104" fill="#818cf8" font-size="11" font-weight="700" text-anchor="middle">Model Aud</text>
    <text x="232" y="121" fill="#94a3b8" font-size="10" text-anchor="middle">ทำนายคะแนน</text>
    <text x="232" y="137" fill="#fbbf24" font-size="10.5" class="formula" text-anchor="middle">s_aud</text>

    <!-- Lines down to Blender -->
    <path d="M 54 146 L 120 174 M 143 146 L 143 174 M 232 146 L 166 174" stroke="#5ee0c2" stroke-width="1.5"/>

    <!-- Score Blender -->
    <rect x="20" y="174" width="246" height="71" rx="6" fill="#162e47" stroke="#5ee0c2"/>
    <text x="143" y="196" fill="#5ee0c2" font-size="12" font-weight="700" text-anchor="middle">Score Blender (ถ่วงน้ำหนัก)</text>
    <text x="143" y="217" fill="#fbbf24" font-size="10.5" class="formula" text-anchor="middle">Score = w₁s₁ + w₂s₂ + w₃s₃</text>
    <text x="143" y="234" fill="#94a3b8" font-size="10" text-anchor="middle">(Weighted Average หรือ Voting)</text>

    <!-- Arrow down to Output -->
    <line x1="143" y1="245" x2="143" y2="265" stroke="#5ee0c2" stroke-width="2" marker-end="url(#arrow)"/>

    <!-- Output -->
    <rect x="58" y="265" width="170" height="30" rx="5" fill="#0f766e" stroke="#5ee0c2"/>
    <text x="143" y="284" fill="#ffffff" font-size="11.5" font-weight="700" text-anchor="middle">🎯 Final Decision Score</text>

    <!-- Pros & Cons Card -->
    <rect x="14" y="308" width="258" height="92" rx="8" fill="#0f1d2c" stroke="#253a52"/>
    <text x="24" y="328" fill="#5ee0c2" font-size="11" font-weight="700">✅ ข้อดี: จุดเด่นสำคัญ</text>
    <text x="24" y="346" fill="#cbd5e1" font-size="10.5">• ยืดหยุ่นสูง หากสื่อใดขาดหาย สามารถข้ามโมเดลนั้นได้</text>
    <text x="24" y="369" fill="#f43f5e" font-size="11" font-weight="700">⚠️ ข้อจำกัด / จุดอ่อน</text>
    <text x="24" y="387" fill="#fca5a5" font-size="10.5">• ไม่เห็นปฏิสัมพันธ์ข้ามสื่อ (Cross-Modal Correlation)</text>
  </g>

  <!-- ==================== PANEL 3: INTERMEDIATE FUSION ==================== -->
  <g transform="translate(629, 75)">
    <rect x="0" y="0" width="286" height="415" rx="10" fill="#15263a" stroke="#fbbf24" stroke-width="1.5" filter="url(#shadow)"/>
    <!-- Badge & Paradigm Title -->
    <rect x="15" y="14" width="145" height="22" rx="11" fill="#fbbf24"/>
    <text x="87" y="29" fill="#0b1927" font-size="10.5" font-weight="700" text-anchor="middle">INTERMEDIATE FUSION</text>
    <text x="15" y="55" fill="#ffffff" font-size="14.5" font-weight="700">Cross-Attention &amp; Gating</text>
    <text x="15" y="71" fill="#94a3b8" font-size="11">แลกเปลี่ยนบริบทในเลเยอร์ซ่อน</text>

    <!-- Encoders -->
    <rect x="18" y="86" width="120" height="48" rx="6" fill="#0f1d2c" stroke="#38bdf8"/>
    <text x="78" y="106" fill="#38bdf8" font-size="11.5" font-weight="700" text-anchor="middle">Text Encoder</text>
    <text x="78" y="123" fill="#94a3b8" font-size="10" text-anchor="middle">เวกเตอร์ข้อความ ht</text>

    <rect x="148" y="86" width="120" height="48" rx="6" fill="#0f1d2c" stroke="#5ee0c2"/>
    <text x="208" y="106" fill="#5ee0c2" font-size="11.5" font-weight="700" text-anchor="middle">Image Encoder</text>
    <text x="208" y="123" fill="#94a3b8" font-size="10" text-anchor="middle">เวกเตอร์รูปภาพ hi</text>

    <!-- Connecting Arrows into Cross-Attention Block -->
    <line x1="78" y1="134" x2="78" y2="152" stroke="#38bdf8" stroke-width="1.8" marker-end="url(#arrowSky)"/>
    <line x1="208" y1="134" x2="208" y2="152" stroke="#5ee0c2" stroke-width="1.8" marker-end="url(#arrow)"/>

    <!-- Cross-Attention Bridge -->
    <rect x="18" y="154" width="250" height="91" rx="6" fill="#1b324d" stroke="#fbbf24"/>
    <text x="143" y="176" fill="#fbbf24" font-size="12" font-weight="700" text-anchor="middle">Cross-Attention Block</text>
    <text x="143" y="196" fill="#e2e8f0" font-size="11" text-anchor="middle">แลกเปลี่ยนบริบท: Text ⇄ Image</text>
    <text x="143" y="213" fill="#94a3b8" font-size="10" text-anchor="middle">คุมน้ำหนักความสนใจข้ามสื่อแบบไดนามิก</text>
    <text x="143" y="232" fill="#fbbf24" font-size="10" class="formula" text-anchor="middle">h_fuse = GatedFusion(ht, hi)</text>

    <!-- Arrow down to Output -->
    <line x1="143" y1="245" x2="143" y2="265" stroke="#fbbf24" stroke-width="2" marker-end="url(#arrowAmber)"/>

    <!-- Output -->
    <rect x="48" y="265" width="190" height="30" rx="5" fill="#0f766e" stroke="#5ee0c2"/>
    <text x="143" y="284" fill="#ffffff" font-size="11" font-weight="700" text-anchor="middle">🎯 SOTA Representation Score</text>

    <!-- Pros & Cons Card -->
    <rect x="14" y="308" width="258" height="92" rx="8" fill="#0f1d2c" stroke="#253a52"/>
    <text x="24" y="328" fill="#fbbf24" font-size="11" font-weight="700">✅ ข้อดี: จุดเด่นสำคัญ</text>
    <text x="24" y="346" fill="#cbd5e1" font-size="10.5">• จุดสมดุลสูงสุด แม่นยำระดับ SOTA สื่อสารข้ามสื่อลึก</text>
    <text x="24" y="369" fill="#38bdf8" font-size="11" font-weight="700">💡 การนำไปใช้งาน</text>
    <text x="24" y="387" fill="#93c5fd" font-size="10.5">• เหมาะกับงานซับซ้อน เช่น แฟชั่น โปสเตอร์ วิดีโอสั้น</text>
  </g>
</svg>
