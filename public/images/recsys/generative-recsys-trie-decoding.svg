<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 460" width="100%" height="100%">
  
    <defs>
      <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#15263a"/>
        <stop offset="100%" stop-color="#0f1d2c"/>
      </linearGradient>
      <linearGradient id="mintGrad" x1="0%" y1="0%" x2="100%" y2="0%">
        <stop offset="0%" stop-color="#5ee0c2"/>
        <stop offset="100%" stop-color="#38bdf8"/>
      </linearGradient>
      <linearGradient id="accentGrad" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%" stop-color="#38bdf8"/>
        <stop offset="100%" stop-color="#818cf8"/>
      </linearGradient>
      <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
        <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.35"/>
      </filter>
      <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M 0 1 L 10 5 L 0 9 z" fill="#5ee0c2" />
      </marker>
      <marker id="arrowSky" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M 0 1 L 10 5 L 0 9 z" fill="#38bdf8" />
      </marker>
      <marker id="arrowIndigo" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M 0 1 L 10 5 L 0 9 z" fill="#818cf8" />
      </marker>
    </defs>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
      .title { font-weight: 700; fill: #ffffff; }
      .subtitle { fill: #94a3b8; font-size: 13px; }
      .badge-text { font-size: 11px; font-weight: 600; text-anchor: middle; fill: #0b1927; }
      .card-title { font-size: 15px; font-weight: 600; fill: #5ee0c2; }
      .card-desc { font-size: 12.5px; fill: #cbd5e1; }
      .formula { font-family: "Courier New", monospace; font-size: 13px; fill: #fbbf24; }
      .axis { stroke: #475569; stroke-width: 1.5; }
      .grid { stroke: #1e293b; stroke-width: 1; stroke-dasharray: 4,4; }
    </style>

  <rect width="100%" height="100%" rx="14" fill="#0b1927" stroke="#253a52" stroke-width="1.5"/>

  <text x="40" y="42" class="title" font-size="20">Generative RecSys: การสร้าง Semantic IDs และ Trie Constrained Decoding</text>
  <text x="40" y="66" class="subtitle">แก้ปัญหาภาพหลอน (Hallucination) ของ LLM ด้วยการบังคับให้ถอดรหัสทีละโทเค็นผ่านโครงสร้างต้นไม้พรีฟิกซ์ (Prefix Trie)</text>

  <g transform="translate(40, 100)">
    <!-- Left: Semantic ID Hierarchy -->
    <g transform="translate(0, 10)">
      <rect x="0" y="0" width="280" height="240" rx="10" fill="#15263a" stroke="#38bdf8" stroke-width="1.5" filter="url(#shadow)"/>
      <text x="140" y="30" fill="#38bdf8" font-weight="700" font-size="14" text-anchor="middle">1. สร้าง Semantic ID (RQ-VAE)</text>

      <g transform="translate(15, 55)">
        <rect x="0" y="0" width="250" height="48" rx="6" fill="#0f1d2c" stroke="#253a52"/>
        <text x="15" y="20" fill="#94a3b8" font-size="11">Item: หนัง The Matrix</text>
        <text x="15" y="38" class="formula" font-size="12">&lt;Action&gt;.&lt;SciFi&gt;.&lt;42&gt;</text>
      </g>

      <g transform="translate(15, 115)">
        <rect x="0" y="0" width="250" height="48" rx="6" fill="#0f1d2c" stroke="#253a52"/>
        <text x="15" y="20" fill="#94a3b8" font-size="11">Item: หนัง Inception</text>
        <text x="15" y="38" class="formula" font-size="12">&lt;Action&gt;.&lt;SciFi&gt;.&lt;99&gt;</text>
      </g>

      <text x="15" y="195" fill="#cbd5e1" font-size="11">• แปลงสินค้าให้เป็นรหัสลำดับชั้น</text>
      <text x="15" y="215" fill="#cbd5e1" font-size="11">• สินค้าแนวเดียวกัน รหัสต้นจะเหมือนกัน</text>
    </g>

    <!-- Arrow -->
    <line x1="290" y1="130" x2="350" y2="130" stroke="#5ee0c2" stroke-width="3" marker-end="url(#arrow)"/>

    <!-- Right: Constrained Trie Tree -->
    <g transform="translate(360, 10)">
      <rect x="0" y="0" width="480" height="240" rx="10" fill="#15263a" stroke="#5ee0c2" stroke-width="1.5" filter="url(#shadow)"/>
      <text x="240" y="30" fill="#5ee0c2" font-weight="700" font-size="14" text-anchor="middle">2. Constrained Trie Decoding (รับประกันของมีจริง 100%)</text>

      <!-- Trie Tree Nodes -->
      <!-- Root -->
      <circle cx="60" cy="115" r="18" fill="#162e47" stroke="#fbbf24" stroke-width="2"/>
      <text x="60" y="120" fill="#fbbf24" font-size="11" text-anchor="middle">Root</text>

      <!-- Level 1 -->
      <line x1="78" y1="115" x2="150" y2="75" stroke="#475569" stroke-width="1.5"/>
      <line x1="78" y1="115" x2="150" y2="155" stroke="#475569" stroke-width="1.5"/>

      <circle cx="165" cy="75" r="18" fill="#162e47" stroke="#38bdf8" stroke-width="2"/>
      <text x="165" y="79" fill="#38bdf8" font-size="9" text-anchor="middle">Action</text>

      <circle cx="165" cy="155" r="18" fill="#162e47" stroke="#94a3b8" stroke-width="1.5"/>
      <text x="165" y="159" fill="#94a3b8" font-size="9" text-anchor="middle">Drama</text>

      <!-- Level 2 -->
      <line x1="183" y1="75" x2="260" y2="75" stroke="#5ee0c2" stroke-width="2"/>
      <circle cx="275" cy="75" r="18" fill="#162e47" stroke="#5ee0c2" stroke-width="2"/>
      <text x="275" y="79" fill="#5ee0c2" font-size="9" text-anchor="middle">SciFi</text>

      <!-- Level 3: Valid Leaf Items -->
      <line x1="293" y1="75" x2="360" y2="55" stroke="#5ee0c2" stroke-width="1.5"/>
      <line x1="293" y1="75" x2="360" y2="95" stroke="#5ee0c2" stroke-width="1.5"/>

      <rect x="365" y="42" width="85" height="25" rx="4" fill="#0f766e" stroke="#5ee0c2"/>
      <text x="407" y="58" fill="#ffffff" font-size="11" text-anchor="middle">Item: #42 ✅</text>

      <rect x="365" y="82" width="85" height="25" rx="4" fill="#0f766e" stroke="#5ee0c2"/>
      <text x="407" y="98" fill="#ffffff" font-size="11" text-anchor="middle">Item: #99 ✅</text>

      <!-- Bottom Explanation -->
      <rect x="25" y="180" width="430" height="45" rx="6" fill="#0f1d2c" stroke="#253a52"/>
      <text x="240" y="200" fill="#fbbf24" font-size="11" text-anchor="middle">Logit Masking: ตัด Token ที่ไม่มีกิ่งใน Trie ออกทันที</text>
      <text x="240" y="216" fill="#cbd5e1" font-size="11" text-anchor="middle">ป้องกันการมั่วรหัสสินค้าที่ไม่มีตัวตนในระบบจริง (Zero Hallucination)</text>
    </g>
  </g>
</svg>