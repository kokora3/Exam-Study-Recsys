<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 460" width="100%" height="100%">
  
    <defs>
      <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#15263a"/>
        <stop offset="100%" stop-color="#0f1d2c"/>
      </linearGradient>
      <linearGradient id="mintGrad" x1="0%" y1="0%" x2="100%" y2="0%">
        <stop offset="0%" stop-color="#5ee0c2"/>
        <stop offset="100%" stop-color="#38bdf8"/>
      </linearGradient>
      <linearGradient id="accentGrad" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%" stop-color="#38bdf8"/>
        <stop offset="100%" stop-color="#818cf8"/>
      </linearGradient>
      <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
        <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.35"/>
      </filter>
      <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M 0 1 L 10 5 L 0 9 z" fill="#5ee0c2" />
      </marker>
      <marker id="arrowSky" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M 0 1 L 10 5 L 0 9 z" fill="#38bdf8" />
      </marker>
      <marker id="arrowIndigo" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M 0 1 L 10 5 L 0 9 z" fill="#818cf8" />
      </marker>
    </defs>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
      .title { font-weight: 700; fill: #ffffff; }
      .subtitle { fill: #94a3b8; font-size: 13px; }
      .badge-text { font-size: 11px; font-weight: 600; text-anchor: middle; fill: #0b1927; }
      .card-title { font-size: 15px; font-weight: 600; fill: #5ee0c2; }
      .card-desc { font-size: 12.5px; fill: #cbd5e1; }
      .formula { font-family: "Courier New", monospace; font-size: 13px; fill: #fbbf24; }
      .axis { stroke: #475569; stroke-width: 1.5; }
      .grid { stroke: #1e293b; stroke-width: 1; stroke-dasharray: 4,4; }
    </style>

  <rect width="100%" height="100%" rx="14" fill="#0b1927" stroke="#253a52" stroke-width="1.5"/>

  <text x="40" y="42" class="title" font-size="20">Matrix Factorization: แยกเมทริกซ์คะแนนสู่ปริภูมิเวกเตอร์แฝง</text>
  <text x="40" y="66" class="subtitle">แยกเมทริกซ์ R (เบาบาง 99%) ออกเป็นผลคูณของ User Matrix P และ Item Matrix Q^T ผ่านมิติแฝง k มิติ (Latent Factors)</text>

  <g transform="translate(40, 100)">
    <!-- Matrix R (Sparse) -->
    <g transform="translate(0, 20)">
      <rect x="0" y="0" width="190" height="230" rx="8" fill="#15263a" stroke="#f43f5e" stroke-width="1.5" filter="url(#shadow)"/>
      <text x="95" y="28" fill="#f43f5e" font-weight="700" font-size="14" text-anchor="middle">Rating Matrix (R)</text>
      <text x="95" y="48" fill="#94a3b8" font-size="11" text-anchor="middle">ขนาด |U| × |I| (ว่าง 99%)</text>

      <g transform="translate(15, 65)">
        <text x="0" y="20" class="formula" font-size="12">[ 5    ?    ?    2    ? ]</text>
        <text x="0" y="50" class="formula" font-size="12">[ ?    4    ?    ?    1 ]</text>
        <text x="0" y="80" class="formula" font-size="12">[ ?    ?    ?    5    ? ]</text>
        <text x="0" y="110" class="formula" font-size="12">[ 1    ?    3    ?    ? ]</text>
      </g>
      <text x="95" y="215" fill="#cbd5e1" font-size="11" text-anchor="middle">? = จุดที่ต้องการทำนาย</text>
    </g>

    <!-- Approx Sign -->
    <text x="215" y="150" fill="#ffffff" font-weight="700" font-size="28">≈</text>

    <!-- Matrix P (Users x k) -->
    <g transform="translate(245, 20)">
      <rect x="0" y="0" width="180" height="230" rx="8" fill="#15263a" stroke="#38bdf8" stroke-width="1.5" filter="url(#shadow)"/>
      <text x="90" y="28" fill="#38bdf8" font-weight="700" font-size="14" text-anchor="middle">User Matrix (P)</text>
      <text x="90" y="48" fill="#94a3b8" font-size="11" text-anchor="middle">ขนาด |U| × k</text>

      <g transform="translate(12, 70)">
        <rect x="0" y="0" width="156" height="24" rx="4" fill="#0f766e"/>
        <text x="78" y="17" fill="#ffffff" class="formula" font-size="10.5" text-anchor="middle">u1: [1.2, -0.4, 0.8]</text>

        <rect x="0" y="35" width="156" height="24" rx="4" fill="#0f1d2c"/>
        <text x="78" y="52" fill="#94a3b8" class="formula" font-size="10.5" text-anchor="middle">u2: [0.1,  0.9, 0.2]</text>

        <rect x="0" y="70" width="156" height="24" rx="4" fill="#0f1d2c"/>
        <text x="78" y="87" fill="#94a3b8" class="formula" font-size="10.5" text-anchor="middle">u3: [0.5, -0.2, 1.1]</text>
      </g>
      <text x="90" y="200" fill="#38bdf8" font-size="11" text-anchor="middle">k มิติรสนิยมแฝง</text>
      <text x="90" y="218" fill="#94a3b8" font-size="10" text-anchor="middle">(เช่น Action, Indie, Humor)</text>
    </g>

    <!-- Multiply Sign -->
    <text x="450" y="150" fill="#ffffff" font-weight="700" font-size="24">×</text>

    <!-- Matrix Q^T (k x Items) -->
    <g transform="translate(480, 45)">
      <rect x="0" y="0" width="220" height="150" rx="8" fill="#15263a" stroke="#5ee0c2" stroke-width="1.5" filter="url(#shadow)"/>
      <text x="110" y="28" fill="#5ee0c2" font-weight="700" font-size="14" text-anchor="middle">Item Matrix (Q^T)</text>
      <text x="110" y="48" fill="#94a3b8" font-size="11" text-anchor="middle">ขนาด k × |I|</text>

      <g transform="translate(15, 65)">
        <rect x="0" y="0" width="190" height="24" rx="4" fill="#0f766e"/>
        <text x="95" y="17" fill="#ffffff" class="formula" font-size="11" text-anchor="middle">q1: [1.1, -0.3, 0.9]</text>
        <rect x="0" y="32" width="190" height="24" rx="4" fill="#0f1d2c"/>
        <text x="95" y="49" fill="#94a3b8" class="formula" font-size="11" text-anchor="middle">q2: [0.2,  0.8, 0.1]</text>
      </g>
    </g>

    <!-- Result Box on Right -->
    <g transform="translate(730, 50)">
      <rect x="0" y="0" width="145" height="140" rx="8" fill="#162e47" stroke="#fbbf24" stroke-width="1.2"/>
      <text x="72.5" y="28" fill="#fbbf24" font-weight="700" font-size="12" text-anchor="middle">Dot Product</text>
      <text x="72.5" y="60" class="formula" font-size="12" text-anchor="middle">r̂_ui = p_u · q_i</text>
      <line x1="15" y1="75" x2="130" y2="75" stroke="#253a52"/>
      <text x="72.5" y="100" fill="#5ee0c2" font-weight="600" font-size="12" text-anchor="middle">ทำนายได้ครบ</text>
      <text x="72.5" y="120" fill="#cbd5e1" font-size="11" text-anchor="middle">ทุกช่อง ? ใน R</text>
    </g>
  </g>
</svg>